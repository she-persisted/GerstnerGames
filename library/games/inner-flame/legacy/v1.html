<title>The Inner Flame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen game. A scene window (sky, ground, cast) sits beside a story console; on narrow screens the scene stacks above it. Single dark space theme by design. */
:root{
  color-scheme: dark;
  --void:#0d0a24;
  --nebula:#191443;
  --nebula-hi:#271f5e;
  --starlight:#f1efff;
  --dust:#aaa5d8;
  --ember:#ff8740;
  --ember-gold:#ffcb5e;
  --on-ember:#2a1100;
  --good:#63e0a6;
  --oops:#ff7a98;

  --metal:#c3cdea;
  --metal-shade:#7684b4;
  --copper:#e0915a;
  --glass:#151036;
  --fur:#221c2a;
  --fur-hi:#3e3550;
  --tan:#c7773d;
  --snow:#fbf7f2;
  --nose:#0c0809;
  --tongue:#ff8fa8;
  --collar:#8b5cf6;
  --peng:#203457;
  --beak:#ffa94d;
  --scarf:#e2577a;
  --stone:#8f8378;
  --stone-sh:#6d6259;
  --moss:#86b85c;
  --ice:#eaf8ff;
  --ice-edge:#9bc9ec;
  --cloud:#fff0fa;
  --tower:#5a1f2e;
  --tw-off:#2c0f18;

  --c-robot:#9fd2ff;
  --c-dog:#ffb46e;
  --c-peng:#8fe6ff;
  --c-rock:#b9d98a;
  --c-flame:#ffcb5e;

  --ground-a:#4a4858; --ground-b:#262433; --sky-top:#1a1830;
  --orb-a:#6d6a80; --orb-b:#34324a;
  --wall:#3b3a48; --roof:#2b2a36; --win:#1d1c26; --leaf:#5b5a66; --trunk:#3a3540;

  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-type:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--starlight);font-family:var(--font-body);font-size:16px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px;max-width:1320px;margin:0 auto}

/* HUD */
.hud{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px}
.logo{margin:0;display:flex;align-items:center;gap:6px;font:800 1.45rem/1 var(--font-display);letter-spacing:-.005em}
.logo svg{width:22px;height:28px;overflow:visible}
.courage{display:flex;align-items:center;gap:10px;flex:1 1 200px;max-width:380px}
.courage .lbl{font:700 .8rem var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.bar{flex:1;height:12px;border-radius:999px;background:var(--nebula);border:1px solid var(--nebula-hi);overflow:hidden}
.bar .fill{display:block;height:100%;width:10%;border-radius:inherit;background:linear-gradient(90deg,var(--c-robot),var(--ember-gold) 70%,var(--ember));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.courage .pct{font:700 .95rem var(--font-display);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.crew{list-style:none;margin:0;padding:0;display:flex;gap:8px;align-items:center}
.crew .lbl{font:700 .8rem var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust);margin-right:2px}
.slot{width:36px;height:36px;border-radius:50%;border:2px dashed var(--nebula-hi);display:grid;place-items:center;color:var(--dust);font:700 1rem var(--font-display);box-sizing:border-box}
.slot.on{border:2px solid var(--who);background:var(--nebula)}
.slot.on.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.slot svg{width:28px;height:28px}
.sound{margin-left:auto}

/* Stage */
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;min-height:0}
.scene{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;background:radial-gradient(130% 90% at 65% 0%,var(--sky-top),var(--void) 72%);border:1px solid var(--nebula-hi)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.orb{position:absolute;top:7%;right:27%;width:clamp(46px,13%,104px);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--orb-a),var(--orb-b) 72%);box-shadow:0 0 38px -8px var(--orb-a);transition:background .8s,box-shadow .8s}
.scene[data-world="puff"] .orb::after{content:"";position:absolute;inset:38% -28%;border-radius:50%;border:3px solid var(--orb-a);opacity:.7;transform:rotate(-14deg)}
.scene[data-world="map"] .orb{background:radial-gradient(circle at 30% 42%,#6cc46f 0 15%,transparent 16%),radial-gradient(circle at 66% 64%,#6cc46f 0 13%,transparent 14%),radial-gradient(circle at 58% 24%,#f4fbff 0 7%,transparent 8%),radial-gradient(circle at 34% 30%,var(--orb-a),var(--orb-b) 72%)}
.world{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.place{position:absolute;left:12px;top:12px;margin:0;padding:.3em .8em;border-radius:999px;background:color-mix(in srgb,var(--void) 62%,transparent);font:700 .95rem/1.2 var(--font-display);letter-spacing:.02em}
.toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,20px);opacity:0;margin:0;padding:.45em 1em;border-radius:999px;background:var(--ember-gold);color:var(--on-ember);font:700 1rem/1.2 var(--font-display);white-space:nowrap;transition:opacity .4s,transform .4s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* World palettes */
.scene[data-world="home"]{--ground-a:#4a4858;--ground-b:#262433;--sky-top:#1a1830;--orb-a:#6d6a80;--orb-b:#34324a}
.scene[data-world="puff"]{--ground-a:#f6b6de;--ground-b:#a866c0;--sky-top:#3a1f5e;--orb-a:#ffd3f0;--orb-b:#b45fa8}
.scene[data-world="frost"]{--ground-a:#e2f5ff;--ground-b:#7cb4df;--sky-top:#16305e;--orb-a:#d6f0ff;--orb-b:#5c8fc4}
.scene[data-world="map"]{--ground-a:#d9a46b;--ground-b:#8a5636;--sky-top:#2d1f45;--orb-a:#8fd8ff;--orb-b:#2a5fb8}
.scene[data-world="ember"]{--ground-a:#ffbf5a;--ground-b:#c2512a;--sky-top:#4a1d3a;--orb-a:#ffe08a;--orb-b:#e0603a}
.scene[data-world="homeLit"]{--ground-a:#8fd26a;--ground-b:#3d8a52;--sky-top:#2b3f7a;--orb-a:#fff2b0;--orb-b:#ffb24d;--wall:#f1d9b5;--roof:#c9573f;--win:#ffcb5e;--leaf:#5cc46e;--trunk:#7a4f33}

.stop-a{stop-color:var(--ground-a);transition:stop-color 1s}
.stop-b{stop-color:var(--ground-b);transition:stop-color 1s}
.rim{fill:none;stroke:var(--starlight);stroke-opacity:.14;stroke-width:2}
.ground{transition:transform 1.1s cubic-bezier(.5,0,.3,1),opacity 1s}
.flying .ground{transform:translateY(130px);opacity:0}
.cast{transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
.flying .cast{transform:translateY(-26px)}
.deco{opacity:0;transition:opacity .9s}
.scene[data-world="home"] .deco-home,.scene[data-world="homeLit"] .deco-home,
.scene[data-world="puff"] .deco-puff,.scene[data-world="frost"] .deco-frost,
.scene[data-world="map"] .deco-map,.scene[data-world="ember"] .deco-ember{opacity:1}
.wall{fill:var(--wall);transition:fill 1.2s}.roof{fill:var(--roof);transition:fill 1.2s}.win{fill:var(--win);transition:fill 1.2s}
.leaf{fill:var(--leaf);transition:fill 1.2s}.trunk{fill:var(--trunk);transition:fill 1.2s}
.puffcloud{fill:var(--cloud);opacity:.95}
.ice{fill:var(--ice);stroke:var(--ice-edge);stroke-width:1.2;stroke-linejoin:round}
.stone2{fill:var(--stone)}.carve{stroke:var(--stone-sh);stroke-width:2;stroke-linecap:round;fill:none}
.tower{fill:var(--tower)}.tower-top{fill:var(--stone-sh)}
.tower-win{fill:var(--tw-off);transition:fill .8s}
.scene[data-floors="1"] .tw1,.scene[data-floors="2"] :is(.tw1,.tw2),.scene[data-floors="3"] :is(.tw1,.tw2,.tw3){fill:var(--ember-gold)}

/* Characters */
.m{fill:var(--metal)}.m-shade{fill:var(--metal-shade)}.m-edge{fill:none;stroke:var(--metal-shade);stroke-width:1.5}
.cu{fill:var(--copper)}.glass{fill:var(--glass)}.face{fill:var(--glass)}
.arm{fill:none;stroke:var(--metal-shade);stroke-width:6;stroke-linecap:round}
.panel{stroke:var(--metal-shade);stroke-width:1.5;stroke-linecap:round;fill:none}
.glint{fill:none;stroke:var(--starlight);stroke-opacity:.5;stroke-width:1.6;stroke-linecap:round}
.eye{fill:var(--snow)}.pupil{fill:var(--void)}.spark{fill:var(--snow)}
.brow,.mouth{fill:none;stroke:var(--c-robot);stroke-width:2.2;stroke-linecap:round}
.antenna{stroke:var(--metal-shade);stroke-width:2.5;stroke-linecap:round}
.bulb{fill:var(--c-robot);transition:fill .8s}
.lit .bulb{fill:var(--ember-gold);filter:drop-shadow(0 0 4px var(--ember))}
.brow-brave,.mouth-smile{display:none}
.brave .brow-worried,.brave .mouth-wobble{display:none}
.brave .brow-brave,.brave .mouth-smile{display:inline}
.chest-flame{opacity:0;transition:opacity 1s}
.lit .chest-flame{opacity:1;filter:drop-shadow(0 0 5px var(--ember))}
.lit .glass{fill:#3a1a10}

.fur{fill:var(--fur)}.fur-c{fill:var(--fur);stroke:var(--fur-hi);stroke-width:1.1}
.white{fill:var(--snow)}.tan{fill:var(--tan)}.nose{fill:var(--nose)}.tongue{fill:var(--tongue)}
.dog-eye{fill:var(--nose);stroke:#8a7e98;stroke-width:.7}
.dog-line{fill:none;stroke:var(--nose);stroke-width:1;stroke-linecap:round}
.collar{fill:none;stroke:var(--collar);stroke-width:3.4;stroke-linecap:round}
.star{fill:var(--ember-gold)}
.peng-dark{fill:var(--peng)}.beak{fill:var(--beak)}.scarf{fill:var(--scarf)}
.bubble{fill:var(--c-peng);fill-opacity:.12;stroke:var(--c-peng);stroke-opacity:.75;stroke-width:1.2}
.stone{fill:var(--stone)}.stone-sh{fill:var(--stone-sh)}.moss{fill:var(--moss)}
.crack{fill:none;stroke:var(--stone-sh);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rock-eye{fill:var(--void)}
.f-outer{fill:var(--ember)}.f-mid{fill:var(--ember-gold)}.f-core{fill:var(--snow)}

.char{opacity:0;transform:translateY(14px) scale(.7);transform-box:fill-box;transform-origin:50% 100%;transition:opacity .6s ease,transform .8s cubic-bezier(.3,1.5,.5,1)}
.char.in{opacity:1;transform:none}
.hop{transform-box:fill-box;transform-origin:50% 100%}
.hop.go{animation:hop .5s ease}
.hop.jolt{animation:jolt .45s ease}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-10px)}}
@keyframes jolt{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.flying .bob{animation:bob 1.8s ease-in-out infinite}
.flying [data-who="dog"] .bob{animation-delay:-.5s}
.flying [data-who="peng"] .bob{animation-delay:-1s}
.flying [data-who="rock"] .bob{animation-delay:-1.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tremble{transform-box:fill-box;transform-origin:50% 100%;animation:tremble .24s linear infinite}
@keyframes tremble{0%,100%{transform:rotate(calc(var(--fear,.9) * -1.6deg))}50%{transform:rotate(calc(var(--fear,.9) * 1.6deg))}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.thrust{opacity:0;transition:opacity .5s}
.flying .thrust{opacity:1}
.flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag .45s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
.sparkles use{fill:var(--ember-gold);transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.sparkles g:nth-child(2) use{animation-delay:-.5s}.sparkles g:nth-child(3) use{animation-delay:-1.1s}
.tail-line{fill:none;stroke:var(--fur);stroke-width:7;stroke-linecap:round}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.bigflame{opacity:0;transform:translate(355px,95px);transition:transform 1.8s cubic-bezier(.5,0,.3,1),opacity .8s}
.bigflame .flicker{filter:drop-shadow(0 0 8px var(--ember))}
.scene[data-world="ember"] .bigflame{opacity:1}
.scene[data-world="ember"] .bigflame.taken{transform:translate(200px,133px) scale(.3)}
.scene .bigflame.gone{opacity:0}

/* Console */
.console{min-height:0;overflow:auto;background:var(--nebula);border:1px solid var(--nebula-hi);border-radius:var(--r);padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;gap:14px;margin-block:auto;width:100%}
.eyebrow{margin:0;font:700 .85rem/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.who{margin:0;display:inline-flex;align-items:center;gap:.5em;font:800 1rem/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--who,var(--dust))}
.who::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--who,var(--dust))}
.line{margin:0;font-size:clamp(1.15rem,1.05rem + .5vw,1.4rem);line-height:1.55;max-width:38ch;text-wrap:pretty}
.say[data-who="narrator"] .line{color:color-mix(in srgb,var(--starlight) 86%,var(--dust))}
.q{margin:0;font:600 clamp(1.15rem,1.05rem + .55vw,1.45rem)/1.45 var(--font-body);max-width:40ch;text-wrap:pretty}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.btn{font:600 1.05rem/1 var(--font-body);padding:.8em 1.3em;border-radius:999px;border:0;background:var(--ember);color:var(--on-ember);cursor:pointer;display:inline-flex;align-items:center;gap:.55em;transition:transform .15s,background .2s}
.btn:hover{background:var(--ember-gold)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--starlight);border:1.5px solid var(--nebula-hi)}
.btn.ghost:hover{border-color:var(--dust);background:var(--nebula-hi)}
.btn:disabled{opacity:.45;cursor:default}
.kbd{font:600 .72rem/1 var(--font-body);padding:.35em .55em;border-radius:6px;background:color-mix(in srgb,var(--on-ember) 16%,transparent)}
:is(.btn,.chip,.help,.field):focus-visible{outline:3px solid var(--ember-gold);outline-offset:3px}
.answer .field{flex:1 1 11rem}
.field{min-width:0;box-sizing:border-box;width:100%;font:500 1.3rem/1.2 var(--font-body);padding:.6em .8em;border-radius:12px;border:2px solid var(--nebula-hi);background:var(--void);color:var(--starlight)}
.field::placeholder{color:var(--dust);opacity:.6}
.field:focus{border-color:var(--ember-gold);outline:none}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips .eyebrow{margin-right:4px}
.chip{font:500 .95rem var(--font-body);padding:.4em .9em;border-radius:999px;border:1.5px solid var(--nebula-hi);background:transparent;color:var(--starlight);cursor:pointer}
.chip:hover{border-color:var(--dust)}
.helpers{display:flex;gap:8px;flex-wrap:wrap}
.help{font:500 .92rem var(--font-body);padding:.5em .95em;border-radius:999px;border:1.5px solid var(--who);background:transparent;color:var(--starlight);cursor:pointer;display:inline-flex;align-items:center;gap:.5em}
.help::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--who)}
.help:hover{background:var(--nebula-hi)}
.help:disabled{opacity:.4;cursor:default;background:transparent}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{margin:0;padding:.65em .9em;border-radius:12px;background:var(--nebula-hi);font-size:1.05rem;border-left:4px solid var(--who)}
.clue b{color:var(--who);font-weight:600}
.blanks{margin:0;font:700 1.6rem/1.2 var(--font-type);letter-spacing:.32em;color:var(--ember-gold);white-space:pre-wrap;word-break:break-word}
.feedback{margin:0;min-height:1.6em;font-size:1.08rem;font-weight:500}
.feedback.good{color:var(--good)}.feedback.oops{color:var(--oops)}
.feedback b{font-family:var(--font-type);letter-spacing:.06em}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{min-width:2.6rem;height:2.9rem;padding-inline:.35em;box-sizing:border-box;display:grid;place-items:center;border-radius:10px;font:700 1.6rem/1 var(--font-type);text-transform:uppercase}
.tile.ice{background:linear-gradient(180deg,var(--ice),var(--ice-edge));color:var(--peng);box-shadow:inset 0 2px 0 var(--snow)}
.tile.num{background:var(--nebula-hi);color:var(--starlight);border:1.5px solid var(--c-rock);font-variant-numeric:tabular-nums}
.tile.ask{border:1.5px dashed var(--ember-gold);color:var(--ember-gold);background:transparent}

/* Flight */
.track{position:relative;height:10px;border-radius:999px;background:var(--void);border:1px solid var(--nebula-hi)}
.track-fill{position:absolute;inset:0 auto 0 0;width:var(--p,0%);border-radius:inherit;background:linear-gradient(90deg,var(--c-robot),var(--ember-gold));transition:width .4s}
.ship{position:absolute;top:50%;left:var(--p,0%);width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ember-gold);box-shadow:0 0 14px var(--ember);transition:left .4s}
.target{margin:0;font:700 clamp(2rem,1.5rem + 2.2vw,3.2rem)/1.3 var(--font-type);letter-spacing:.04em;white-space:pre-wrap;word-break:break-word}
.target .todo{color:var(--dust);opacity:.55}
.target .ok{color:var(--good)}
.target .bad{color:var(--oops);text-decoration:underline wavy;text-underline-offset:6px}
.target .cur{color:var(--starlight);box-shadow:inset 0 -4px 0 var(--ember-gold)}
.target.done{animation:hop .4s ease}
.upnext{margin:0;color:var(--dust);font-size:.95rem}
.upnext b{font:500 1rem var(--font-type);color:var(--starlight);opacity:.75;margin-inline:.35em}
.type-field{font:600 1.6rem/1.2 var(--font-type);letter-spacing:.04em}
.meter{margin:0;display:flex;gap:18px;flex-wrap:wrap;color:var(--dust);font-variant-numeric:tabular-nums}
.meter b{color:var(--starlight);font-weight:600}

/* Title + end */
.flamemark{width:56px;height:72px;overflow:visible}
.big{margin:0;font:800 clamp(2.4rem,1.9rem + 2.6vw,3.7rem)/1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.big .hot{color:var(--ember-gold);text-shadow:0 0 24px color-mix(in srgb,var(--ember) 55%,transparent)}
.byline{margin:0;font:700 1.05rem var(--font-display);color:var(--c-dog)}
.howto{margin:0;color:var(--dust);font-size:.95rem;max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:10px;margin:0}
.stat{background:var(--nebula-hi);border-radius:12px;padding:.7em .9em}
.stat dt{font:700 .75rem/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.stat dd{margin:0;font:800 1.7rem/1.15 var(--font-display);font-variant-numeric:tabular-nums}

@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:minmax(0,1fr)}
  .scene{height:min(44vh,330px);min-height:230px}
  .sound{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .tremble,.flying .bob,.flicker,.tail,.sparkles use,.hop.go,.hop.jolt,.eyes,.slot.on.pop,.target.done{animation:none !important}
  .char,.bigflame,.ground,.cast,.bar .fill{transition:none !important}
}
</style>

<div class="app">
  <header class="hud">
    <h1 class="logo"><svg viewBox="-16 -42 32 44" aria-hidden="true"><g class="flicker"><use href="#flamePath" class="f-outer"/><use href="#flamePath" class="f-mid" transform="scale(.6)"/></g></svg>The Inner Flame</h1>
    <div class="courage" role="meter" aria-label="Courage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10" id="courage">
      <span class="lbl">Courage</span>
      <span class="bar"><span class="fill" id="courageFill"></span></span>
      <span class="pct" id="couragePct">10%</span>

    for (let i = 1; i <= m; i++) {

      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

      <form class="answer" id="startForm" autocomplete="off">
        <label class="sr" for="robotName">Name your robot</label>
        <input id="robotName" class="field" maxlength="14" placeholder="Name your robot" value="${saved ? esc(saved.robot) : ""}">
        <button class="btn" type="submit">Start the adventure</button>
      </form>
      <div class="chips"><span class="eyebrow">Ideas</span>${ideas.map(n => `<button type="button" class="chip" data-name="${n}">${n}</button>`).join("")}</div>
      ${saved ? `<div class="actions" style="justify-content:flex-start"><button type="button" class="btn ghost" id="resumeBtn">Keep going on ${esc(WORLDS[saved.world] || "your adventure")}</button></div>` : ""}
      <p class="howto">How to play: type words to fly your ship, type answers to solve riddles, and press Enter to keep the story going.</p>
    </div>`;
    const input = $("#robotName");
    panel.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { input.value = c.dataset.name; input.focus(); }));
    $("#startForm").addEventListener("submit", e => {
      e.preventDefault(); audio();
      S = fresh(); S.robot = cleanName(input.value) || "Sprocket"; S.picks = makePicks();
      active = true; clearSave(); resetScene(); paintCourage(); paintCrew(); go(0);
    });
    const rb = $("#resumeBtn");
    if (rb) rb.addEventListener("click", () => { audio(); S = Object.assign(fresh(), saved); active = true; restore(); go(S.step); });
    focusSoon(input);
  }

  /* Dialog */
  function renderSay(st) {
    const c = CAST[st.who];
    panel.innerHTML = `<div class="card say" data-who="${st.who}" style="--who:${c.color}">
      <p class="who">${esc(c.label())}</p>
      <p class="line">${T(st.x)}</p>
      <div class="actions"><button class="btn" type="button" data-primary>Next <span class="kbd">Enter</span></button></div>
    </div>`;
    if (CAST[st.who] && st.who !== "narrator" && st.who !== "flame") hop(st.who);
    if (st.who === "dog") sfx.woof();
    bindPrimary(next);
  }

  /* Naming the dog */
  function renderName(st) {
    panel.innerHTML = `<div class="card">
      <p class="eyebrow">Name your new friend</p>
      <p class="q">${T(st.ask)}</p>
      <form class="answer" id="nameForm" autocomplete="off">
        <label class="sr" for="nameIn">The dog's name</label>
        <input id="nameIn" class="field" maxlength="14" placeholder="${st.ideas[0]}">
        <button class="btn" type="submit">That's the name!</button>
      </form>
      <div class="chips"><span class="eyebrow">Ideas</span>${st.ideas.map(n => `<button type="button" class="chip" data-name="${n}">${n}</button>`).join("")}</div>
    </div>`;
    const input = $("#nameIn");
    panel.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { input.value = c.dataset.name; input.focus(); }));
    $("#nameForm").addEventListener("submit", e => { e.preventDefault(); S.dog = cleanName(input.value) || st.ideas[0]; next(); });
    focusSoon(input);
  }

  /* Typing flights */
  function renderFly(st) {
    const vow = st.words === "vow";
    const list = vow ? [VOW] : sample(WORDS[st.words], st.n);
    if (!vow) setFlying(true);
    let idx = 0, wordStart = 0, keys = 0, good = 0;
    panel.innerHTML = `<div class="card fly">
      <p class="eyebrow">${vow ? "The brave words" : "Flying to " + esc(st.to)}</p>
      ${vow ? "" : `<div class="track" id="track"><span class="track-fill"></span><span class="ship" aria-hidden="true"></span></div>`}
      <p class="target" id="target"></p>
      <p class="upnext" id="upnext"></p>
      <label class="sr" for="typeIn">Type the words you see</label>
      <input id="typeIn" class="field type-field" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <p class="meter" id="meter"></p>
      <div class="actions" id="flyDone"></div>
    </div>`;
    const input = $("#typeIn"), tgt = $("#target");

    function paint() {
      const word = list[idx], v = input.value;
      let html = "";
      for (let i = 0; i < word.length; i++) {
        const ch = word[i];
        let cls = "todo";
        if (i < v.length) cls = v[i].toLowerCase() === ch.toLowerCase() ? "ok" : "bad";
        else if (i === v.length) cls = "cur";
        html += `<span class="${cls}">${ch === " " ? " " : esc(ch)}</span>`;
      }
      tgt.innerHTML = html;
      tgt.setAttribute("aria-label", "Type: " + word);
      const rest = list.slice(idx + 1, idx + 4);
      $("#upnext").innerHTML = vow ? "Type it just like you see it. Capital letters are optional." :
        (rest.length ? "Up next:" + rest.map(w => `<b>${esc(w)}</b>`).join("") : "Last one! Get ready to land.");
      const acc = keys ? Math.round(good / keys * 100) : 100;
      $("#meter").innerHTML = (vow ? "" : `<span>Word <b>${Math.min(idx + 1, list.length)}</b> of ${list.length}</span>`) + `<span>Accuracy <b>${acc}%</b></span>`;
      const tr = $("#track"); if (tr) tr.style.setProperty("--p", (idx / list.length * 100) + "%");
    }

    input.addEventListener("keydown", e => {
      if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
      if (!wordStart) wordStart = performance.now();
      const word = list[idx], pos = input.selectionStart ?? input.value.length;
      keys++; S.stats.keys++;
      if (word && word[pos] && e.key.toLowerCase() === word[pos].toLowerCase()) { good++; S.stats.good++; sfx.key(); }
      else sfx.miss();
    });

    input.addEventListener("input", () => {
      const word = list[idx];
      if (input.value.length > word.length + 3) input.value = input.value.slice(0, word.length + 3);
      if (input.value.toLowerCase().replace(/[.!]$/, "") === word.toLowerCase()) {
        if (wordStart) { S.stats.typeMs += performance.now() - wordStart; S.stats.typeChars += word.length; }
        wordStart = 0; S.stats.words += vow ? word.split(" ").length : 1;
        sfx.word(); boost(); hop("robot");
        tgt.classList.remove("done"); void tgt.offsetWidth; tgt.classList.add("done");
        idx++; input.value = "";
        if (idx >= list.length) return finish();
      }
      paint(); save();
    });

    function finish() {
      input.disabled = true;
      const tr = $("#track"); if (tr) tr.style.setProperty("--p", "100%");
      tgt.innerHTML = `<span class="ok">${vow ? "Courage: real!" : "Nice flying!"}</span>`;
      const acc = keys ? Math.round(good / keys * 100) : 100;
      $("#upnext").textContent = vow ? "The flame flares bright and warm." : `You typed ${list.length} ${list.length === 1 ? "word" : "words"} with ${acc}% accuracy.`;
      $("#meter").innerHTML = "";
      const label = vow ? "Take the flame" : "Land on " + st.to.replace(/^home to /, "");
      $("#flyDone").innerHTML = `<button class="btn" type="button" data-primary>${esc(label)} <span class="kbd">Enter</span></button>`;
      if (vow) addCourage(4);
      bindPrimary(next);
    }

    paint();
    focusSoon(input);
  }

  /* Puzzles */
  function judge(p, raw, shown) {
    const nz = squash(raw);
    if (!nz) return { ok: false, empty: true };
    for (const ans of p.a) {
      const bz = squash(ans);
      if (nz === bz || nz === bz + "s" || nz + "s" === bz || nz === bz + "es") return { ok: true };
    }
    if (shown) return { ok: false };
    if (p.kind !== "scramble" && p.kind !== "pattern") {
      for (const ans of p.a) {
        const bz = squash(ans);
        if (bz.length >= 5 && /^[a-z]+$/.test(bz)) {
          const d = lev(nz, bz);
          if (d <= 1 || (bz.length >= 8 && d <= 2)) return { ok: true, spell: ans };
        }
      }
    }
    if (p.kind === "scramble") {
      const srt = x => [...x].sort().join("");
      if (srt(nz) === srt(squash(p.a[0]))) return { ok: false, anagram: true };
    }
    return { ok: false };
  }

  function scrambled(w) {
    let s = w, n = 0;
    while ((s === w || s.slice(0, 2) === w.slice(0, 2)) && n < 40) { s = shuffle([...w]).join(""); n++; }
    return s;
  }

  function renderPuzzle(st) {
    const p = PZ[S.picks[st.set][st.n]];
    const ans = p.a[0];
    const has = w => S.crew.includes(w);
    let tries = 0, shown = false, scanned = false, sniffed = false, pondered = false;
    const revealed = new Set();

    let extra = "";
    if (p.kind === "scramble") { const s = scrambled(ans); extra = `<div class="tiles" aria-label="Letters: ${s.split("").join(" ")}">${s.split("").map(c => `<span class="tile ice">${c}</span>`).join("")}</div>`; }
    if (p.kind === "pattern") extra = `<div class="tiles" aria-label="${p.seq.join(", ")}, and then what?">${p.seq.map(n => `<span class="tile num">${n}</span>`).join("")}<span class="tile num ask">?</span></div>`;

    const helpers = [
      `<button type="button" class="help" data-help="scan" style="--who:var(--c-robot)">Scan letters</button>`,
      has("dog") ? `<button type="button" class="help" data-help="sniff" style="--who:var(--c-dog)">${esc(S.dog)} sniffs a clue</button>` : "",
      has("peng") ? `<button type="button" class="help" data-help="peek" style="--who:var(--c-peng)">Pebble peeks a letter</button>` : "",
      has("rock") && p.clue2 ? `<button type="button" class="help" data-help="ponder" style="--who:var(--c-rock)">Atlas ponders</button>` : "",
      `<button type="button" class="help" data-help="show" style="--who:var(--dust)" hidden>Show me the answer</button>`
    ].join("");

    panel.innerHTML = `<div class="card puzzle">
      <p class="eyebrow">${SET_LABEL[st.set](st.n)}</p>
      <p class="q">${esc(p.q)}</p>
      ${extra}
      <p class="blanks" id="blanks" hidden></p>
      <div class="clues" id="clues"></div>
      <form class="answer" id="ansForm" autocomplete="off">
        <label class="sr" for="ans">Your answer</label>
        <input id="ans" class="field" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" inputmode="${p.kind === "pattern" ? "numeric" : "text"}">
        <button class="btn" type="submit">Check</button>
      </form>
      <div class="helpers" id="helpers">${helpers}</div>
      <p class="feedback" id="fb" aria-live="assertive"></p>
      <div class="actions" id="puzDone"></div>
    </div>`;

    const input = $("#ans"), fb = $("#fb");
    const say = (html, cls = "") => { fb.className = "feedback " + cls; fb.innerHTML = html; };
    const btn = k => panel.querySelector(`[data-help="${k}"]`);
    const letters = [...ans].map((c, i) => ({ c, i })).filter(o => o.c !== " ");

    function paintBlanks() {
      const b = $("#blanks"); b.hidden = false;
      b.textContent = [...ans].map((c, i) => c === " " ? "  " : (shown || revealed.has(i) ? c.toUpperCase() : "_")).join(" ");
      b.setAttribute("aria-label", `${letters.length} letters`);
    }
    function addClue(who, text) {
      const c = CAST[who];
      $("#clues").insertAdjacentHTML("beforeend", `<p class="clue" style="--who:${c.color}"><b>${esc(c.label())}:</b> ${esc(text)}</p>`);
    }
    function usedHint() { S.stats.hints++; sfx.hint(); save(); }

    $("#helpers").addEventListener("click", e => {
      const b = e.target.closest("[data-help]"); if (!b || b.disabled) return;
      const k = b.dataset.help;
      if (k === "scan") { scanned = true; paintBlanks(); b.disabled = true; hop("robot"); usedHint(); say(`Scanning... the answer has <b>${letters.length}</b> ${p.kind === "pattern" ? (letters.length === 1 ? "digit" : "digits") : "letters"}.`); }
      if (k === "sniff") { sniffed = true; addClue("dog", p.clue); b.disabled = true; hop("dog"); sfx.woof(); usedHint(); say(""); }
      if (k === "peek") {
        const hidden = letters.filter(o => !revealed.has(o.i));
        if (hidden.length > 1) { revealed.add(hidden[0].i); scanned = true; paintBlanks(); hop("peng"); usedHint(); say(""); }
        if (letters.filter(o => !revealed.has(o.i)).length <= 1) b.disabled = true;
      }
      if (k === "ponder") { pondered = true; addClue("rock", p.clue2); b.disabled = true; hop("rock"); usedHint(); say(""); }
      if (k === "show") {
        shown = true; S.stats.shown++; paintBlanks();
        panel.querySelectorAll("[data-help]").forEach(x => { x.disabled = true; });
        say(`The answer is <b>${esc(ans.toUpperCase())}</b>. Type it in to keep going!`);
        input.value = ""; save();
      }
      input.focus({ preventScroll: true });
    });

    const OOPS = ["Hmm, not quite. Try again!", "Good guess, but that's not it. Give it another think!", "Not that one. You can do it!", "Nope! Take a breath, think it over, and try again."];
    $("#ansForm").addEventListener("submit", e => {
      e.preventDefault();
      const res = judge(p, input.value, shown);
      if (res.empty) { say("Type your answer first, then press Enter."); return; }
      if (res.ok) return win(res);
      tries++; sfx.wrong(); hop("robot", "jolt");
      if (shown) { say(`Almost! Type <b>${esc(ans.toUpperCase())}</b> exactly.`, "oops"); input.select(); return; }
      let msg = res.anagram ? "Those are the right letters, but that's not the frozen word. Try mixing them another way!" : OOPS[(tries - 1) % OOPS.length];
      if (tries === 2) {
        if (has("dog") && !sniffed) msg += ` Psst: ${esc(S.dog)} can sniff out a clue.`;
        else if (!scanned) msg += " Psst: try Scan letters.";
        else if (has("peng")) msg += " Psst: Pebble can peek at a letter.";
      }
      if (tries >= 3) { btn("show").hidden = false; msg += " Or press Show me the answer."; }
      say(msg, "oops"); input.select();
    });

    function win(res) {
      input.disabled = true; panel.querySelectorAll(".answer button, [data-help]").forEach(x => { x.disabled = true; });
      sfx.right(); hop("robot");
      ["dog", "peng", "rock"].forEach((w, i) => { if (S.crew.includes(w)) setTimeout(() => hop(w), 120 + i * 120); });
      if (!shown) { S.stats.solved++; addCourage(4); } else addCourage(1);
      if (st.set === "ember") { S.floors = st.n + 1; scene.dataset.floors = String(S.floors); }
      const cheers = ["Yes! You got it!", "Woo-hoo! That's right!", "Correct! Super brain power!", "Nailed it!", "Right on! The stone glows!"];
      let msg = shown ? "There you go! Now you know that one." : pick(cheers);
      if (res.spell && squash(res.spell) !== squash(input.value)) msg += ` It's spelled <b>${esc(res.spell.toUpperCase())}</b>.`;
      say(msg, "good");
      $("#puzDone").innerHTML = `<button class="btn" type="button" data-primary>Next <span class="kbd">Enter</span></button>`;
      save(); bindPrimary(next);
    }

    focusSoon(input);
  }

  /* Ending */
  function renderEnd() {
    clearSave(); active = false;
    const st = S.stats;
    const acc = st.keys ? Math.round(st.good / st.keys * 100) : 100;
    const wpm = st.typeMs > 0 ? Math.round((st.typeChars / 5) / (st.typeMs / 60000)) : 0;
    const friends = S.crew.map(w => esc(CAST[w].label()));
    sfx.join();
    panel.innerHTML = `<div class="card end">
      <p class="eyebrow">The End</p>
      <h2 class="big">You found the Inner <span class="hot">Flame</span>!</h2>
      <p class="line">${esc(S.robot)} started out scared and alone. Now Ashlund is glowing, and ${friends.slice(0, -1).join(", ")}${friends.length > 1 ? ", and " : ""}${friends.slice(-1)} are right by his side.</p>
      <dl class="stats">
        <div class="stat"><dt>Words typed</dt><dd>${st.words}</dd></div>
        <div class="stat"><dt>Typing accuracy</dt><dd>${acc}%</dd></div>
        <div class="stat"><dt>Typing speed</dt><dd>${wpm} <small style="font-size:.5em">wpm</small></dd></div>
        <div class="stat"><dt>Puzzles solved</dt><dd>${st.solved} of 12</dd></div>
        <div class="stat"><dt>Helper clues</dt><dd>${st.hints}</dd></div>
      </dl>
      <p class="howto">Every new game picks different riddles, so play again to see new ones and beat your typing speed.</p>
      <div class="actions" style="justify-content:flex-start"><button class="btn" type="button" data-primary>Play again <span class="kbd">Enter</span></button></div>
    </div>`;
    bindPrimary(() => { const name = S.robot; S = fresh(); resetScene(); paintCourage(); paintCrew(); renderTitle(); const i = $("#robotName"); if (i) i.value = name; });
  }

  /* Global Enter: continue the story even if focus wandered */
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (e.repeat) { e.preventDefault(); return; }
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "BUTTON" || tag === "TEXTAREA") return;
    const b = panel.querySelector("[data-primary]:not([disabled])");
    if (b) { e.preventDefault(); b.click(); }
  }, true);

  /* Boot, with live-update support */
  try { window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), active })); } catch (e) {}
  function boot(data) {
    paintCourage(); paintCrew();
    if (data && data.S && data.active) { S = Object.assign(fresh(), data.S); active = true; restore(); go(S.step); }
    else renderTitle();
  }
  try {
    if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
    else boot(window.claude?.hot?.data ?? {});
  } catch (e) { boot({}); }
})();
</script>
