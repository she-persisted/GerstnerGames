<title>Starward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade adventure. A scene window (walkable map, side-view worlds, falling words) sits beside a slim console; on narrow screens the scene stacks above it. Single dark space theme by design. */
:root{
  color-scheme: dark;
  --void:#0d0a24; --nebula:#191443; --nebula-hi:#271f5e; --starlight:#f1efff; --dust:#aaa5d8;
  --ember:#ff8740; --ember-gold:#ffcb5e; --on-ember:#2a1100; --good:#63e0a6; --oops:#ff7a98; --warn:#ffb86b;

  --metal:#c3cdea; --metal-shade:#7684b4; --copper:#e0915a; --glass:#151036; --cheek:#ff8fa8;
  --fur:#211b29; --curl:#4f4566; --tan:#c7773d; --iris:#6b4428; --snow:#fbf7f2; --nose:#0c0809; --tongue:#ff8fa8; --toe:#c9c2d6; --collar:#8b5cf6;
  --peng:#203457; --beak:#ffa94d; --scarf:#e2577a; --stone:#8f8378; --stone-sh:#6d6259; --moss:#86b85c; --lens:#e8d9a8; --scope:#b9a27a;
  --ice:#eaf8ff; --ice-edge:#9bc9ec; --cloud:#fff0fa; --tower:#5a1f2e; --tw-off:#2c0f18;
  --dirt:#8a6a4a; --dirt-dark:#4e3a2a; --dirt-text:#fbeedd;

  --c-robot:#9fd2ff; --c-dog:#ffb46e; --c-peng:#8fe6ff; --c-rock:#b9d98a; --c-flame:#ffcb5e;

  --ground-a:#565878; --ground-b:#272640; --sky-top:#1a1a36; --orb-a:#6d6a80; --orb-b:#34324a;
  --wall:#3b3a52; --roof:#2b2a40; --win:#1d1c2c; --leaf:#4a4a66; --trunk:#34304a; --worm:#5a5880; --dome:#6b6f92;

  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-type:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-arcade:"Press Start 2P",ui-monospace,Menlo,monospace;
  --r:18px;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--starlight);font-family:var(--font-body);font-size:16px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px;max-width:1340px;margin:0 auto}

/* HUD */
.hud{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px}
.logo{margin:0;display:flex;align-items:center;gap:8px;font:800 1.5rem/1 var(--font-display);letter-spacing:.01em}
.logo svg{width:24px;height:24px;overflow:visible}
.star{fill:var(--ember-gold)}
.courage{display:flex;align-items:center;gap:10px;flex:1 1 200px;max-width:360px}
.lbl{font:700 .8rem var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.bar{flex:1;height:12px;border-radius:999px;background:var(--nebula);border:1px solid var(--nebula-hi);overflow:hidden}
.bar .fill{display:block;height:100%;width:8%;border-radius:inherit;background:linear-gradient(90deg,var(--c-robot),var(--ember-gold) 70%,var(--ember));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.pct{font:700 .95rem var(--font-display);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.crew{list-style:none;margin:0;padding:0;display:flex;gap:8px;align-items:center}
.slot{width:36px;height:36px;border-radius:50%;border:2px dashed var(--nebula-hi);display:grid;place-items:center;color:var(--dust);font:700 1rem var(--font-display);box-sizing:border-box}
.slot.on{border:2px solid var(--who);background:var(--nebula)}
.slot.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.slot svg{width:28px;height:28px}
.toggles{margin-left:auto;display:flex;gap:8px}

/* Stage */
.stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;min-height:0}
.scene{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;background:radial-gradient(130% 90% at 65% 0%,var(--sky-top),var(--void) 72%);border:1px solid var(--nebula-hi)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapcv{display:none !important;cursor:pointer;touch-action:none}
.scene.mapmode .mapcv{display:block !important}
.scene.mapmode #stars,.scene.mapmode .world,.scene.mapmode .orb{display:none}
.orb{position:absolute;top:7%;right:27%;width:clamp(46px,13%,104px);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--orb-a),var(--orb-b) 72%);box-shadow:0 0 38px -8px var(--orb-a);transition:opacity .6s}
.scene[data-world="nimbus"] .orb::after{content:"";position:absolute;inset:38% -28%;border-radius:50%;border:3px solid var(--orb-a);opacity:.7;transform:rotate(-14deg)}
.scene[data-world="meridian"] .orb{background:radial-gradient(circle at 30% 42%,#6cc46f 0 15%,transparent 16%),radial-gradient(circle at 66% 64%,#6cc46f 0 13%,transparent 14%),radial-gradient(circle at 58% 24%,#f4fbff 0 7%,transparent 8%),radial-gradient(circle at 34% 30%,var(--orb-a),var(--orb-b) 72%)}
.scene.attract .orb{opacity:0}
.world{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.place{position:absolute;left:12px;top:12px;margin:0;padding:.3em .8em;border-radius:999px;background:color-mix(in srgb,var(--void) 62%,transparent);font:700 .95rem/1.2 var(--font-display);letter-spacing:.02em;z-index:2}
.toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,20px);opacity:0;margin:0;padding:.45em 1em;border-radius:999px;background:var(--ember-gold);color:var(--on-ember);font:700 1rem/1.2 var(--font-display);white-space:nowrap;transition:opacity .4s,transform .4s;pointer-events:none;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Worlds */
.scene[data-world="lumina"]{--ground-a:#565878;--ground-b:#272640;--sky-top:#1a1a36}
.scene[data-world="luminaLit"]{--ground-a:#8fd26a;--ground-b:#3d8a52;--sky-top:#2b3f7a;--orb-a:#fff2b0;--orb-b:#ffb24d;--wall:#f1d9b5;--roof:#c9573f;--win:#ffcb5e;--leaf:#5cc46e;--trunk:#7a4f33;--worm:#ffe58a;--dome:#e7d6b0}
.scene[data-world="nimbus"]{--ground-a:#f6b6de;--ground-b:#a866c0;--sky-top:#3a1f5e;--orb-a:#ffd3f0;--orb-b:#b45fa8}
.scene[data-world="glacia"]{--ground-a:#e2f5ff;--ground-b:#7cb4df;--sky-top:#16305e;--orb-a:#d6f0ff;--orb-b:#5c8fc4}
.scene[data-world="meridian"]{--ground-a:#d9a46b;--ground-b:#8a5636;--sky-top:#2d1f45;--orb-a:#8fd8ff;--orb-b:#2a5fb8}
.scene[data-world="corona"]{--ground-a:#ffbf5a;--ground-b:#c2512a;--sky-top:#4a1d3a;--orb-a:#ffe08a;--orb-b:#e0603a}
.stop-a{stop-color:var(--ground-a);transition:stop-color 1s}
.stop-b{stop-color:var(--ground-b);transition:stop-color 1s}
.rim{fill:none;stroke:var(--starlight);stroke-opacity:.14;stroke-width:2}
.ground{transition:transform 1.1s cubic-bezier(.5,0,.3,1),opacity 1s}
.flying .ground{transform:translateY(130px);opacity:0}
.plain,.lumina-planet{transition:opacity .8s}
.scene[data-world^="lumina"] .plain{opacity:0;visibility:hidden}
.scene:not([data-world^="lumina"]) .lumina-planet{opacity:0;visibility:hidden}
.spin{transform-origin:200px 430px;transition:transform 1.5s cubic-bezier(.45,0,.25,1)}
.deco{opacity:0;transition:opacity .9s}
.scene[data-world="nimbus"] .deco-nimbus,.scene[data-world="glacia"] .deco-glacia,.scene[data-world="meridian"] .deco-meridian,.scene[data-world="corona"] .deco-corona{opacity:1}
.wall{fill:var(--wall);transition:fill 1.2s}.roof{fill:var(--roof);transition:fill 1.2s}.win{fill:var(--win);transition:fill 1.2s}
.leaf{fill:var(--leaf);transition:fill 1.2s}.trunk{fill:var(--trunk);transition:fill 1.2s}.dome{fill:var(--dome);transition:fill 1.2s}
.worms circle{fill:var(--worm);transition:fill 1.2s}
.scene[data-world="luminaLit"] .worms circle{filter:drop-shadow(0 0 2px var(--ember-gold))}
.pit{fill:var(--ground-b);opacity:.6}.pebble{fill:var(--stone-sh)}
.padbase{fill:var(--metal-shade)}
.gantry{stroke:var(--metal-shade);stroke-width:2.4;fill:none;stroke-linecap:round}
.crater-rim{fill:none;stroke:var(--dust);stroke-opacity:.35;stroke-width:3}
.comet-rock{fill:var(--c-peng);filter:drop-shadow(0 0 4px var(--c-peng))}
.slit{stroke:var(--void);stroke-width:3}.door{fill:var(--roof)}
.scope{fill:var(--scope)}.tripod{stroke:var(--stone-sh);stroke-width:1.8;fill:none;stroke-linecap:round}
.zzz{font:700 11px var(--font-display);fill:var(--dust)}.zzz.small{font-size:8px}
.scene[data-world="luminaLit"] .zzz{display:none}
.puffcloud{fill:var(--cloud);opacity:.95}
.ice{fill:var(--ice);stroke:var(--ice-edge);stroke-width:1.2;stroke-linejoin:round}
.stone2{fill:var(--stone)}.carve{stroke:var(--stone-sh);stroke-width:2;stroke-linecap:round;fill:none}
.tower{fill:var(--tower)}.tower-top{fill:var(--stone-sh)}
.tower-win{fill:var(--tw-off);transition:fill .8s}
.scene[data-floors="1"] .tw1,.scene[data-floors="2"] :is(.tw1,.tw2),.scene[data-floors="3"] :is(.tw1,.tw2,.tw3){fill:var(--ember-gold)}

/* Characters */
.m{fill:var(--metal)}.m-shade{fill:var(--metal-shade)}.m-edge{fill:none;stroke:var(--metal-shade);stroke-width:1.5}
.cu{fill:var(--copper)}.glass,.face{fill:var(--glass)}
.arm{fill:none;stroke:var(--metal-shade);stroke-width:6;stroke-linecap:round}
.panel{stroke:var(--metal-shade);stroke-width:1.5;stroke-linecap:round;fill:none}
.glint{fill:none;stroke:var(--starlight);stroke-opacity:.5;stroke-width:1.6;stroke-linecap:round}
.eye{fill:var(--snow)}.pupil{fill:var(--void)}.spark{fill:var(--snow)}
.happy-eye{fill:none;stroke:var(--snow);stroke-width:2.8;stroke-linecap:round}
.brow,.mouth{fill:none;stroke:var(--c-robot);stroke-width:2.2;stroke-linecap:round}
.mouth-grin{fill:var(--c-robot);stroke:none}
.cheeks circle{fill:var(--cheek);opacity:.75}
.antenna{stroke:var(--metal-shade);stroke-width:2.5;stroke-linecap:round}
.bulb{fill:var(--c-robot);transition:fill .8s}
.robot[data-face="surprised"] .bulb{fill:var(--ember-gold)}
.lit .bulb{fill:var(--ember-gold);filter:drop-shadow(0 0 4px var(--ember))}
.robot .eyes-happy,.robot .eyes-wide,.robot .eyes-think,.robot .brow-brave,.robot .brow-up,.robot .brow-think,.robot .mouth-smile,.robot .mouth-grin,.robot .mouth-o,.robot .mouth-hmm,.robot .cheeks{display:none}
.robot.brave .brow-worried,.robot.brave .mouth-wobble{display:none}
.robot.brave .brow-brave,.robot.brave .mouth-smile{display:inline}
.robot[data-face] .eyes-normal,.robot[data-face] .brow-worried,.robot[data-face] .brow-brave,.robot[data-face] .mouth-wobble,.robot[data-face] .mouth-smile{display:none}
.robot[data-face="happy"] :is(.eyes-happy,.brow-brave,.mouth-grin,.cheeks){display:inline}
.robot[data-face="surprised"] :is(.eyes-wide,.brow-up,.mouth-o){display:inline}
.robot[data-face="think"] :is(.eyes-think,.brow-think,.mouth-hmm){display:inline}
.ember{transform-box:fill-box;transform-origin:50% 100%;transform:scale(calc(.4 + var(--warm,.08) * .55));opacity:calc(.45 + var(--warm,.08) * .45);transition:transform 1s,opacity 1s}
.lit .ember{transform:scale(1.1);opacity:1}
.lit .chest-flame{filter:drop-shadow(0 0 5px var(--ember))}
.lit .glass{fill:#3a1a10}
.fur{fill:var(--fur)}.fur-c{fill:var(--fur);stroke:var(--curl);stroke-width:.9}
.curl{fill:none;stroke:var(--curl);stroke-width:1.1;stroke-linecap:round}
.white{fill:var(--snow)}.tan{fill:var(--tan)}.iris{fill:var(--iris)}.nose{fill:var(--nose)}.tongue{fill:var(--tongue)}
.toe{stroke:var(--toe);stroke-width:.9;stroke-linecap:round}
.dog-line{fill:none;stroke:var(--nose);stroke-width:1;stroke-linecap:round}
.collar{fill:none;stroke:var(--collar);stroke-width:3.4;stroke-linecap:round}
.peng-dark{fill:var(--peng)}.beak{fill:var(--beak)}.scarf{fill:var(--scarf)}
.bubble{fill:var(--c-peng);fill-opacity:.12;stroke:var(--c-peng);stroke-opacity:.75;stroke-width:1.2}
.stone{fill:var(--stone)}.stone-sh{fill:var(--stone-sh)}.moss{fill:var(--moss)}
.crack{fill:none;stroke:var(--stone-sh);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rock-eye{fill:var(--void)}
.specs{fill:var(--lens);fill-opacity:.14;stroke:var(--lens);stroke-width:1.2}
.f-outer{fill:var(--ember)}.f-mid{fill:var(--ember-gold)}.f-core{fill:var(--snow)}

.cast{transition:opacity .6s,transform 1.1s cubic-bezier(.5,0,.3,1)}
.scene.ship .cast,.scene.attract .cast{opacity:0}
.char{opacity:0;transform:translateY(14px) scale(.7);transform-box:fill-box;transform-origin:50% 100%;transition:opacity .6s ease,transform .8s cubic-bezier(.3,1.5,.5,1)}
.char.in{opacity:1;transform:none}
.hop{transform-box:fill-box;transform-origin:50% 100%}
.hop.go{animation:hop .5s ease}
.hop.jolt{animation:jolt .45s ease}
.walking .hop{animation:walk .34s ease-in-out infinite}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-10px)}}
@keyframes jolt{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-1.5deg)}75%{transform:translateY(-4px) rotate(1.5deg)}}
.tremble{transform-box:fill-box;transform-origin:50% 100%;animation:tremble .24s linear infinite}
@keyframes tremble{0%,100%{transform:rotate(calc(var(--fear,.9) * -1.6deg))}50%{transform:rotate(calc(var(--fear,.9) * 1.6deg))}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag .45s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
.sparkles use{fill:var(--ember-gold);transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.sparkles g:nth-child(2) use{animation-delay:-.5s}.sparkles g:nth-child(3) use{animation-delay:-1.1s}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}
.bigflame{opacity:0;transform:translate(355px,95px);transition:transform 1.8s cubic-bezier(.5,0,.3,1),opacity .8s}
.bigflame .flicker{filter:drop-shadow(0 0 8px var(--ember))}
.scene[data-world="corona"] .bigflame{opacity:1}
.scene[data-world="corona"] .bigflame.taken{transform:translate(200px,133px) scale(.3)}
.scene .bigflame.gone{opacity:0}

/* Rocket */
.fly-rocket{opacity:0;transition:opacity .5s}
.scene.ship .fly-rocket{opacity:1}
.lift{transition:transform 1.2s cubic-bezier(.5,0,.3,1)}
.flying .lift{transform:translateY(-34px)}
.flying .bob-ship{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.rumble{animation:rumble .08s linear infinite}
@keyframes rumble{0%{transform:translate(0,0)}25%{transform:translate(-1px,.6px)}50%{transform:translate(1px,-.6px)}75%{transform:translate(-.6px,-.6px)}100%{transform:translate(.6px,.6px)}}
.rflame{transform-box:fill-box;transform-origin:50% 0;transition:transform .6s}
.flying .fly-rocket .rflame{transform:scale(1.25,1.8)}
.scene.ship #padRocket{opacity:0}
#padRocket{transition:opacity .4s}

/* Falling words */
.arena{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fw{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:.45em;padding:.38em .8em;border-radius:999px;background:color-mix(in srgb,var(--nebula) 88%,transparent);border:2px solid var(--nebula-hi);font:700 clamp(1.1rem,.95rem + .8vw,1.65rem)/1 var(--font-type);color:var(--starlight);white-space:pre;will-change:transform;box-shadow:0 0 18px -6px var(--c-robot)}
.fw.target{border-color:var(--ember-gold);box-shadow:0 0 24px -4px var(--ember)}
.fw .ok{color:var(--good)}.fw .cur{box-shadow:inset 0 -3px 0 var(--ember-gold)}
.fw-star{width:.8em;height:.8em;flex:none;background:var(--ember-gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.fw.caught{transition:transform .5s ease-in,opacity .5s;opacity:0}
.fw.lost{transition:opacity .6s,filter .6s;opacity:0;filter:grayscale(1)}
.fw.shake{animation:fwshake .25s}
@keyframes fwshake{0%,100%{margin-left:0}30%{margin-left:-5px}60%{margin-left:5px}}
.countdown{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.countdown span{font:800 clamp(4rem,10vw,7.5rem)/1 var(--font-display);color:var(--ember-gold);text-shadow:0 0 30px color-mix(in srgb,var(--ember) 70%,transparent);animation:countpop .75s ease-out both}
.countdown .go{font-size:clamp(2.6rem,7vw,5rem)}
@keyframes countpop{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:.95}}

/* High score board */
.board{font-family:var(--font-arcade);background:color-mix(in srgb,var(--void) 84%,transparent);border:2px solid var(--ember-gold);border-radius:14px;padding:16px 18px;box-shadow:0 0 30px -10px var(--ember);color:var(--starlight);box-sizing:border-box}
.board h3{margin:0 0 14px;font:400 .95rem/1.4 var(--font-arcade);color:var(--ember-gold);text-align:center;letter-spacing:.08em}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.board li{display:grid;grid-template-columns:2.8em minmax(0,1fr) auto;gap:10px;font-size:.7rem;line-height:1.6;align-items:baseline}
.board .rk{color:var(--dust)}
.board .nm{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-variant-numeric:tabular-nums;color:var(--ember-gold);text-align:right}
.board li.first .nm{color:var(--ember-gold)}
.board li.me,.board li.me .sc,.board li.me .nm{color:var(--good)}
.board li.me{animation:blinkrow 1s steps(2) 6}
@keyframes blinkrow{50%{opacity:.35}}
.board li.empty{opacity:.4}
.board .note{margin:14px 0 0;font:500 .82rem/1.4 var(--font-body);color:var(--dust);text-align:center}
.scene-board{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);width:min(440px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;display:none;z-index:2}
.scene.attract .scene-board{display:block}
.panel-board{display:none}

/* Console */
.console{min-height:0;overflow:auto;background:var(--nebula);border:1px solid var(--nebula-hi);border-radius:var(--r);padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;gap:14px;margin-block:auto;width:100%}
.eyebrow{margin:0;display:flex;align-items:center;gap:.45em;font:700 .85rem/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.eyebrow svg{width:1.1em;height:1.1em;fill:currentColor}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pips{display:inline-flex;gap:7px;align-items:center}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--ember-gold);box-sizing:border-box}
.pip.on{background:var(--ember-gold)}
.pip.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--ember-gold) 30%,transparent)}
.kind{margin:0;align-self:flex-start;padding:.2em .75em;border-radius:999px;background:var(--nebula-hi);font:700 .8rem/1.4 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--c-robot)}
.who{margin:0;display:inline-flex;align-items:center;gap:.5em;font:800 1rem/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--who,var(--dust))}
.who::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--who,var(--dust))}
.line{margin:0;font-size:clamp(1.15rem,1.05rem + .5vw,1.4rem);line-height:1.55;max-width:38ch;text-wrap:pretty}
.say[data-who="narrator"] .line{color:color-mix(in srgb,var(--starlight) 86%,var(--dust))}
.q{margin:0;font:600 clamp(1.15rem,1.05rem + .55vw,1.45rem)/1.5 var(--font-body);max-width:40ch;text-wrap:pretty}
.q.eq{font:700 clamp(1.8rem,1.4rem + 1.6vw,2.6rem)/1.2 var(--font-type);letter-spacing:.04em}
.slot-blank{display:inline-block;min-width:4.5ch;padding:0 .35em;margin:0 .15em;border-bottom:3px solid var(--ember-gold);color:var(--ember-gold);text-align:center;font-family:var(--font-type);line-height:1.2}
.slot-blank.filled{color:var(--good);border-color:var(--good)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.actions.start{justify-content:flex-start}
.actions.split{justify-content:space-between}
.btn{font:600 1.05rem/1 var(--font-body);padding:.8em 1.3em;border-radius:999px;border:0;background:var(--ember);color:var(--on-ember);cursor:pointer;display:inline-flex;align-items:center;gap:.55em;transition:transform .15s,background .2s}
.btn:hover{background:var(--ember-gold)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--starlight);border:1.5px solid var(--nebula-hi)}
.btn.ghost:hover{border-color:var(--dust);background:var(--nebula-hi)}
.btn.small{font-size:.9rem;padding:.6em 1em}
.btn.icon{padding:.6em .8em}
.btn svg{width:1.15em;height:1.15em;fill:currentColor}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{font-size:1.3rem;padding:.9em 1.6em}
.btn.check{padding:.5em 1.1em}
.btn.check svg{width:1.9em;height:1.9em}
.kbd{font:600 .72rem/1 var(--font-body);padding:.35em .55em;border-radius:6px;background:color-mix(in srgb,var(--on-ember) 16%,transparent)}
:is(.btn,.chip,.help,.field,.opt,.playbtn):focus-visible{outline:3px solid var(--ember-gold);outline-offset:3px}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.answer .field{flex:1 1 11rem}
.field{min-width:0;box-sizing:border-box;width:100%;font:500 1.3rem/1.2 var(--font-body);padding:.6em .8em;border-radius:12px;border:2px solid var(--nebula-hi);background:var(--void);color:var(--starlight)}
.field::placeholder{color:var(--dust);opacity:.6}
.field:focus{border-color:var(--ember-gold);outline:none}
.arcade-field{font:400 1rem/1.4 var(--font-arcade);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:500 .95rem var(--font-body);padding:.4em .9em;border-radius:999px;border:1.5px solid var(--nebula-hi);background:transparent;color:var(--starlight);cursor:pointer}
.chip:hover{border-color:var(--dust)}
.helpers{display:flex;gap:8px;flex-wrap:wrap}
.help{font:600 .95rem var(--font-body);padding:.35em .9em .35em .4em;border-radius:999px;border:1.5px solid var(--who);background:transparent;color:var(--starlight);cursor:pointer;display:inline-flex;align-items:center;gap:.4em}
.help svg{width:26px;height:26px;flex:none}
.help:hover{background:var(--nebula-hi)}
.help:disabled{opacity:.4;cursor:default;background:transparent}
.help.nudge{animation:nudge .9s ease-in-out 4}
@keyframes nudge{0%,100%{transform:scale(1);box-shadow:none}50%{transform:scale(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--who) 35%,transparent)}}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{margin:0;padding:.65em .9em;border-radius:12px;background:var(--nebula-hi);font-size:1.05rem;border-left:4px solid var(--who)}
.clue b{color:var(--who);font-weight:600}
.blanks{margin:0;font:700 1.6rem/1.2 var(--font-type);letter-spacing:.32em;color:var(--ember-gold);white-space:pre-wrap;word-break:break-word}
.feedback{margin:0;min-height:1.6em;font-size:1.1rem;font-weight:600}
.feedback.good{color:var(--good)}.feedback.oops{color:var(--oops)}
.feedback b{font-family:var(--font-type);letter-spacing:.06em}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{min-width:2.6rem;height:2.9rem;padding-inline:.35em;box-sizing:border-box;display:grid;place-items:center;border-radius:10px;font:700 1.6rem/1 var(--font-type);text-transform:uppercase}
.tile.ice{background:linear-gradient(180deg,var(--ice),var(--ice-edge));color:var(--peng);box-shadow:inset 0 2px 0 var(--snow)}
.tile.num{background:var(--nebula-hi);color:var(--starlight);border:1.5px solid var(--c-rock);font-variant-numeric:tabular-nums}
.tile.ask{border:1.5px dashed var(--ember-gold);color:var(--ember-gold);background:transparent}
.tile.word{font:600 1.15rem/1 var(--font-body);text-transform:none;padding-inline:.8em;background:var(--nebula-hi);border:1.5px solid var(--c-robot)}

/* Map console + digging */
.roam-ship{display:flex;justify-content:center}
.roam-ship svg{width:120px;height:228px;overflow:visible}
.partslots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.partslots li{aspect-ratio:1;border-radius:14px;border:2px dashed var(--nebula-hi);display:grid;place-items:center;max-width:100%}
.partslots li.got{border:2px solid var(--good);background:var(--nebula-hi)}
.partslots svg{width:62%;height:62%;overflow:visible}
.target-ship svg{width:46px;height:88px;overflow:visible}
.clods{display:flex;gap:12px;flex-wrap:wrap}
.clod{padding:.7em 1.1em;border-radius:46% 54% 40% 60%/60% 45% 55% 40%;background:radial-gradient(circle at 35% 30%,var(--dirt),var(--dirt-dark));font:700 clamp(1.5rem,1.2rem + 1.2vw,2rem)/1.1 var(--font-type);color:var(--dirt-text);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:transform .2s}
.clod .todo{opacity:.7}.clod .ok{color:var(--good)}.clod .cur{box-shadow:inset 0 -3px 0 var(--ember-gold)}
.clod.cur{outline:3px solid var(--ember-gold);outline-offset:3px}
.clod.gone{animation:crumble .45s forwards}
.clod.shake{animation:fwshake .25s}
@keyframes crumble{to{transform:scale(.2) rotate(20deg);opacity:0}}
.shovel{width:46px;height:46px;flex:none}
.digrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* Choice tiles */
.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:14px;border:2px solid var(--nebula-hi);background:var(--void);color:var(--starlight);cursor:pointer;font:600 .92rem/1.25 var(--font-body);text-align:center}
.opt svg{width:66px;height:126px;overflow:visible}
.opt:hover{border-color:var(--ember-gold)}
.shipshow{display:flex;justify-content:center}
.shipshow svg{width:110px;height:210px;overflow:visible}

/* Flight */
.bigword{margin:0;font:700 clamp(2.2rem,1.6rem + 2.6vw,3.4rem)/1.25 var(--font-type);letter-spacing:.05em;min-height:1.3em;white-space:pre-wrap;word-break:break-word}
.bigword .todo{color:var(--dust);opacity:.6}.bigword .ok{color:var(--good)}.bigword .cur{color:var(--starlight);box-shadow:inset 0 -4px 0 var(--ember-gold)}
.bigword .wait{display:inline-flex;gap:6px}
.bigword .wait i{width:.5em;height:.5em;border-radius:50%;background:var(--dust);animation:dot 1s infinite}
.bigword .wait i:nth-child(2){animation-delay:.15s}.bigword .wait i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
.target{margin:0;font:700 clamp(1.8rem,1.4rem + 2vw,2.8rem)/1.35 var(--font-type);letter-spacing:.04em;white-space:pre-wrap;word-break:break-word}
.target .todo{color:var(--dust);opacity:.55}.target .ok{color:var(--good)}.target .cur{color:var(--starlight);box-shadow:inset 0 -4px 0 var(--ember-gold)}
.goal{padding-top:22px}
.goal-bar{position:relative;height:16px;border-radius:999px;background:var(--void);border:1px solid var(--nebula-hi)}
.goal-fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:var(--good);transition:width .25s,background .25s}
.goal-fill.low{background:var(--warn)}
.goal-mark{position:absolute;top:-6px;bottom:-6px;left:85%;width:3px;border-radius:2px;background:var(--starlight)}
.goal-flag{position:absolute;left:85%;top:-24px;transform:translateX(-50%);font:700 .8rem/1 var(--font-display);color:var(--starlight);white-space:nowrap}
.bigpct{margin:0;font:400 clamp(1.8rem,1.4rem + 1.8vw,2.6rem)/1 var(--font-arcade);color:var(--good)}
.bigpct.low{color:var(--warn)}
.starrow{display:flex;gap:6px;flex-wrap:wrap}
.st{width:20px;height:20px;background:var(--nebula-hi);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.st.caught{background:var(--ember-gold)}
.st.lost{background:var(--dust);opacity:.35}
.meter{margin:0;display:flex;gap:18px;flex-wrap:wrap;color:var(--dust);font-variant-numeric:tabular-nums}
.meter b{color:var(--starlight);font-weight:600}

/* Title, songs, end */
.titlehead{display:flex;align-items:center;gap:14px}
.starmark{width:54px;height:54px;flex:none;overflow:visible;filter:drop-shadow(0 0 12px var(--ember))}
.big{margin:0;font:800 clamp(2.4rem,1.9rem + 2.6vw,3.7rem)/1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.big .hot{color:var(--ember-gold);text-shadow:0 0 24px color-mix(in srgb,var(--ember) 55%,transparent)}
.byline{margin:4px 0 0;font:700 1.05rem var(--font-display);color:var(--c-dog)}
.jukebox{display:flex;flex-direction:column;gap:8px}
.jlist{display:flex;flex-direction:column;gap:6px}
.track-row{display:flex;align-items:center;gap:12px;padding:.5em .7em;border-radius:12px;background:var(--nebula-hi)}
.track-row.locked{background:transparent;border:1.5px dashed var(--nebula-hi);color:var(--dust)}
.track-row .tt{flex:1;min-width:0;font-weight:600;line-height:1.3}
.track-row .tw{display:block;font-size:.8rem;font-weight:400;color:var(--dust)}
.playbtn{flex:none;width:2.3rem;height:2.3rem;border-radius:50%;border:0;background:var(--ember);color:var(--on-ember);display:grid;place-items:center;cursor:pointer}
.playbtn svg{width:14px;height:14px}
.playbtn.on{background:var(--good)}
.note-ic{width:1.1rem;height:1.1rem;flex:none;fill:var(--dust)}
.songtitle{margin:0;display:flex;align-items:center;gap:.4em;font:800 clamp(1.6rem,1.3rem + 1.4vw,2.2rem)/1.1 var(--font-display);color:var(--ember-gold)}
.songtitle svg{width:1em;height:1em;fill:currentColor}
.scorecard{display:grid;gap:6px;background:var(--void);border:1.5px solid var(--nebula-hi);border-radius:14px;padding:12px 14px}
.sc-row{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sc-row span:last-child{font:400 .85rem var(--font-arcade);color:var(--ember-gold);font-variant-numeric:tabular-nums}
.sc-total{border-top:1px dashed var(--nebula-hi);padding-top:8px;font-weight:600}
.sc-total span:last-child{font-size:1.15rem}
.rankmsg{margin:0;font:400 1rem/1.4 var(--font-arcade);color:var(--good);min-height:1.4em}

@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:minmax(0,1fr)}
  .scene{height:min(52vh,380px);min-height:260px}
  .toggles{margin-left:0}
  .scene.attract .scene-board{display:none}
  .scene.attract .cast{opacity:1}
  .panel-board{display:block}
  .roam-ship svg{width:84px;height:160px}
}
@media (prefers-reduced-motion:reduce){
  .tremble,.bob-ship,.flicker,.tail,.sparkles use,.hop.go,.hop.jolt,.walking .hop,.eyes,.slot.pop,.rumble,.fw.shake,.countdown span,.board li.me,.help.nudge,.clod.gone,.clod.shake,.bigword .wait i{animation:none !important}
  .char,.bigflame,.ground,.cast,.bar .fill,.spin,.lift,.fw.caught,.fw.lost{transition:none !important}
}

  function makePicks() {
    const seen = lsGet(KEYS.seen, []), seenList = Array.isArray(seen) ? seen : [];

    const key = p => squash(p.a[0]).replace(/s$/, "");

      const old = pool.filter(p => seenSet.has(p.id)).sort((x, y) => seenList.indexOf(x.id) - seenList.indexOf(y.id));
      const out = [];
      for (const p of [...fresh, ...old]) { const k = key(p); if (used.has(k)) continue; used.add(k); out.push(p); chosen.push(p.id); if (out.length === n) break; }
      return out;
    };

  /* ----- Puzzles ----- */
  function judge(p, raw, shown) {
    const nz = squash(raw);
    if (!nz) return { ok: false, empty: true };
    for (const ans of p.a) {
      const bz = squash(ans);
      if (nz === bz || nz === bz + "s" || nz + "s" === bz || nz === bz + "es") return { ok: true };
    }
    if (shown) return { ok: false };
    if (!["scramble", "pattern", "math"].includes(p.kind)) {
      for (const ans of p.a) {

        if (bz.length >= 5 && /^[a-z]+$/.test(bz)) { const d = lev(nz, bz); if (d <= 1 || (bz.length >= 8 && d <= 2)) return { ok: true, spell: ans }; }
      }

    if (p.kind === "scramble") { const srt = x => [...x].sort().join(""); if (srt(nz) === srt(squash(p.a[0]))) return { ok: false, anagram: true }; }

  }
  function scrambled(w) {

    return s;

    let extra = "";
    if (p.kind === "scramble") { const s = scrambled(ans); extra = `<div class="tiles" aria-label="Letters: ${s.split("").join(" ")}">${s.split("").map(c => `<span class="tile ice">${c}</span>`).join("")}</div>`; }
    if (p.kind === "pattern") extra = `<div class="tiles" aria-label="${p.seq.join(", ")}, and then what?">${p.seq.map(n => `<span class="tile num">${n}</span>`).join("")}<span class="tile num ask">?</span></div>`;
    if (p.kind === "odd") extra = `<div class="tiles">${p.tiles.map(w => `<span class="tile word">${esc(w)}</span>`).join("")}</div>`;
    const qText = p.kind === "blank" ? blankHTML(p.q, null) : p.kind === "odd" ? "Which one does not belong?" : esc(p.q);
    const helpers = [
      `<button type="button" class="help" data-help="scan" style="--who:var(--c-robot)">${MINI.robot}<span>Scan</span></button>`,
      has("dog") ? `<button type="button" class="help" data-help="sniff" style="--who:var(--c-dog)">${MINI.dog}<span>Sniff</span></button>` : "",
      has("peng") ? `<button type="button" class="help" data-help="peek" style="--who:var(--c-peng)">${MINI.peng}<span>Peek</span></button>` : "",
      has("rock") ? `<button type="button" class="help" data-help="ponder" style="--who:var(--c-rock)">${MINI.rock}<span>Ponder</span></button>` : "",
      `<button type="button" class="help" data-help="show" style="--who:var(--dust)" hidden>${ICON.eye.replace("<svg ", '<svg style="width:20px;height:20px;fill:currentColor" ')}<span>Show me</span></button>`
    ].join("");
    panel.innerHTML = `<div class="card puzzle">
      ${opts.head || ""}
      <p class="kind">${KIND[p.kind]}</p>
      ${p.q || p.kind === "odd" || p.kind === "blank" ? `<p class="q ${p.eq ? "eq" : ""}" id="qtext">${qText}</p>` : ""}
      ${extra}
      <p class="blanks" id="blanks" hidden></p>
      <div class="clues" id="clues"></div>
      <form class="answer" id="ansForm" autocomplete="off">
        <label class="sr" for="ans">Your answer</label>
        <input id="ans" class="field" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="?" inputmode="${numeric ? "numeric" : "text"}">
        <button class="btn check" type="submit">${ICON.check}<span class="sr">Check</span></button>
      </form>
      <div class="helpers" id="helpers">${helpers}</div>
      <p class="feedback" id="fb" aria-live="assertive"></p>
      <div class="actions ${opts.leave ? "split" : ""}" id="puzDone">${opts.leave ? `<button type="button" class="btn ghost icon" id="leaveBtn" aria-label="Walk away">${ICON.back}</button>` : ""}</div>
    </div>`;
    const input = $("#ans"), fb = $("#fb");
    const say2 = (html, cls = "") => { fb.className = "feedback " + cls; fb.innerHTML = html; };
    function paintBlanks() {
      const b = $("#blanks"); b.hidden = false;
      b.textContent = [...ans].map((c, i) => c === " " ? "  " : (shown || revealed.has(i) ? c.toUpperCase() : "_")).join(" ");
      b.setAttribute("aria-label", `${letterList.length} ${numeric ? "digits" : "letters"}`);
    }
    function addClue(who, text) {
      const c = CAST[who];
      $("#clues").insertAdjacentHTML("beforeend", `<p class="clue" style="--who:${c.color}"><b>${esc(c.label())}:</b> ${esc(text)}</p>`);
    }
    const usedHint = k => { used.add(k); S.stats.hints++; sfx.hint(); express("think", 1400); save(); panel.querySelectorAll(".help.nudge").forEach(x => x.classList.remove("nudge")); };
    if (opts.leave) $("#leaveBtn").addEventListener("click", opts.leave);
    $("#helpers").addEventListener("click", e => {
      const b = e.target.closest("[data-help]"); if (!b || b.disabled) return;
      const k = b.dataset.help;
      if (k === "scan") { paintBlanks(); b.disabled = true; usedHint(k); }
      if (k === "sniff") { addClue("dog", p.clue); b.disabled = true; hop("dog"); sfx.woof(); usedHint(k); }
      if (k === "peek") {
        const hidden = letterList.filter(o => !revealed.has(o.i));
        if (hidden.length > 1) { revealed.add(hidden[0].i); paintBlanks(); hop("peng"); usedHint(k); }
        if (letterList.filter(o => !revealed.has(o.i)).length <= 1) b.disabled = true;
      }
      if (k === "ponder") { addClue("rock", p.clue2 || `It starts with ${ans[0].toUpperCase()}.`); b.disabled = true; hop("rock"); usedHint(k); }
      if (k === "show") {
        shown = true; S.stats.shown++; paintBlanks();
        panel.querySelectorAll("[data-help]").forEach(x => { x.disabled = true; x.classList.remove("nudge"); });
        say2("");
        input.value = ""; save();
      }
      input.focus({ preventScroll: true });
    });
    const OOPS = ["Not quite!", "Try again!", "Almost! Think again.", "Nope! You've got this."];
    $("#ansForm").addEventListener("submit", e => {
      e.preventDefault();
      if (input.disabled) return;
      const res = judge(p, input.value, shown);
      if (res.empty) { input.focus(); return; }
      if (res.ok) return win(res);
      tries++; sfx.wrong(); hop("robot", "jolt"); express("think", 1500);
      if (shown) { say2(`<b>${esc(ans.toUpperCase())}</b>`, "oops"); input.select(); return; }
      say2(res.anagram ? "Right letters, wrong order!" : OOPS[(tries - 1) % OOPS.length], "oops");
      if (tries === 2) {
        const order = ["sniff", "peek", "ponder", "scan"];
        const nb = order.map(k => panel.querySelector(`[data-help="${k}"]`)).find(x => x && !x.disabled && !used.has(x.dataset.help));
        if (nb) nb.classList.add("nudge");
      }
      if (tries >= 3) { const sb = panel.querySelector('[data-help="show"]'); sb.hidden = false; sb.classList.add("nudge"); }
      input.select();
    });
    function win(res) {
      input.disabled = true;
      panel.querySelectorAll(".answer button, [data-help]").forEach(x => { x.disabled = true; });
      sfx.right(); hop("robot"); express("happy", 2200);
      ["dog", "peng", "rock"].forEach((w, i) => { if (S.crew.includes(w)) setTimeout(() => hop(w), 120 + i * 120); });
      if (!shown) { S.stats.solved++; addCourage(3); } else addCourage(1);
      if (opts.set === "corona") { S.floors = opts.n + 1; scene.dataset.floors = String(S.floors); }
      if (opts.site) { const s = SITES.find(x => x.id === opts.site); burst(s.x, s.y - s.beacon, TOK.gold, 12); }
      if (p.kind === "blank") $("#qtext").innerHTML = blankHTML(p.q, ans);
      const cheers = ["Yes!", "Woo-hoo!", "Nailed it!", "Brain power!", "Right on!"];
      let msg = shown ? "There you go!" : pick(cheers);
      if (res.spell && squash(res.spell) !== squash(input.value)) msg += ` <b>${esc(res.spell.toUpperCase())}</b>`;
      say2(msg, "good");
      $("#puzDone").className = "actions";
      $("#puzDone").innerHTML = nextBtn("Next", '<span class="kbd">Enter</span>');
      save(); bindPrimary(onDone);
    }
    focusSoon(input);
  }

  /* ----- Ending ----- */
  function computeScore() {
    const L = Object.values(S.stats.legs || {});
    const sum = k => L.reduce((t, l) => t + (Number(l[k]) || 0), 0);
    const hits = sum("hits"), misses = sum("misses"), ms = sum("typeMs"), chars = sum("typeChars");
    const acc = hits + misses ? Math.round(hits / (hits + misses) * 100) : 0;
    const wpm = ms > 0 ? Math.round((chars / 5) / (ms / 60000)) : 0;
    const puzzlePts = S.stats.solved * 100 + S.stats.shown * 25, speedPts = wpm * 20, accPts = acc * 5;
    return { acc, wpm, puzzlePts, speedPts, accPts, total: puzzlePts + speedPts + accPts };
  }
  function renderEnd() {
    lsDel(KEYS.save); active = false;
    Music.set("reborn"); express("happy", 3000);
    const sc = computeScore();
    panel.innerHTML = `<div class="card end">
      <h2 class="big">You brought back the <span class="hot">Everlight!</span></h2>
      <div class="scorecard" aria-label="Your score">
        <p class="sc-row"><span>Puzzles: ${S.stats.solved} of ${TOTAL_PUZZLES}</span><span>${sc.puzzlePts}</span></p>
        <p class="sc-row"><span>Speed: ${sc.wpm} words per minute</span><span>${sc.speedPts}</span></p>
        <p class="sc-row"><span>Accuracy: ${sc.acc}%</span><span>${sc.accPts}</span></p>
        <p class="sc-row sc-total"><span>Score</span><span>${sc.total}</span></p>
      </div>
      <form class="answer" id="hsForm" autocomplete="off">
        <label class="sr" for="hsName">Your name for the high score board</label>
        <input id="hsName" class="field arcade-field" maxlength="10" placeholder="YOUR NAME">
        <button class="btn check" type="submit">${ICON.check}<span class="sr">Save score</span></button>
      </form>
      <p class="rankmsg" id="rankMsg"></p>
      <div class="board end-board"></div>
      <div class="actions start"><button class="btn ghost" type="button" id="againBtn">${ICON.retry} Play again</button></div>
    </div>`;
    renderBoard();
    const again = () => { const name = S.robot; S = fresh(); resetScene(); paintCourage(); paintCrew(); renderTitle(); const i = $("#robotName"); if (i) i.value = name; };
    $("#againBtn").addEventListener("click", again);
    $("#hsForm").addEventListener("submit", async e => {
      e.preventDefault();
      const nm = $("#hsName").value.replace(/[^A-Za-z0-9 ]/g, "").trim().slice(0, 10);
      if (!nm) { $("#hsName").focus(); return; }
      $("#hsForm").querySelectorAll("input,button").forEach(x => { x.disabled = true; });
      await saveScore({ name: nm, score: sc.total, puzzles: S.stats.solved, wpm: sc.wpm, acc: sc.acc, robot: S.robot.slice(0, 14), at: new Date().toISOString() });
      const rank = boardAll().findIndex(r => r.id === boardMine) + 1;
      $("#rankMsg").textContent = rank && rank <= 10 ? `#${rank}!` : "Saved!";
      sfx.join(); express("happy", 2500);
      const ab = $("#againBtn"); ab.className = "btn"; focusSoon(ab);
    });
    focusSoon($("#hsName"));
  }

  /* Global Enter: continue the story even if focus wandered */
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (e.repeat) { e.preventDefault(); return; }
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "BUTTON" || tag === "TEXTAREA") return;
    const b = panel.querySelector("[data-primary]:not([disabled])");
    if (b) { e.preventDefault(); b.click(); }
  }, true);

  /* Boot, with live-update support */
  try { window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), active })); } catch (e) {}
  function boot(data) {
    paintCourage(); paintCrew(); resetScene(); initBoard();
    if (data && data.S && data.active && data.S.v === 3) { S = Object.assign(fresh(), data.S); active = true; scene.classList.remove("attract"); restore(); go(S.step); }
    else renderTitle();
  }
  try {
    if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
    else boot(window.claude?.hot?.data ?? {});
  } catch (e) { boot({}); }
})();
</script>
