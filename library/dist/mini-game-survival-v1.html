<title>Mini Game Survival v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* ==== kit/base.css ==== */
/**
 * @file kit/base.css
 * @about Core look shared by every game: color and font tokens, the one-screen layout (top bar, scene, side panel), buttons, text boxes, choice tiles, title text, and toasts. Single dark space theme by design.
 * @requires nothing
 */
:root{
  color-scheme: dark;
  --void:#0d0a24; --nebula:#191443; --nebula-hi:#271f5e; --starlight:#f1efff; --dust:#aaa5d8;
  --ember:#ff8740; --ember-gold:#ffcb5e; --on-ember:#2a1100; --good:#63e0a6; --oops:#ff7a98; --warn:#ffb86b;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-type:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-arcade:"Press Start 2P",ui-monospace,Menlo,monospace;
  --r:18px;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--starlight);font-family:var(--font-body);font-size:16px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px;max-width:1340px;margin:0 auto}

/* Top bar */
.hud{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px}
.logo{margin:0;display:flex;align-items:center;gap:8px;font:800 1.5rem/1 var(--font-display);letter-spacing:.01em}
.logo svg{width:24px;height:24px;overflow:visible}
.star{fill:var(--ember-gold)}
.courage{display:flex;align-items:center;gap:10px;flex:1 1 200px;max-width:360px}
.lbl{font:700 .8rem var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.bar{flex:1;height:12px;border-radius:999px;background:var(--nebula);border:1px solid var(--nebula-hi);overflow:hidden}
.bar .fill{display:block;height:100%;width:8%;border-radius:inherit;background:linear-gradient(90deg,var(--c-robot,#9fd2ff),var(--ember-gold) 70%,var(--ember));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.pct{font:700 .95rem var(--font-display);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.crew{list-style:none;margin:0;padding:0;display:flex;gap:8px;align-items:center}
.slot{width:36px;height:36px;border-radius:50%;border:2px dashed var(--nebula-hi);display:grid;place-items:center;color:var(--dust);font:700 1rem var(--font-display);box-sizing:border-box}
.slot.on{border:2px solid var(--who);background:var(--nebula)}
.slot.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.slot svg{width:28px;height:28px}
.toggles{margin-left:auto;display:flex;gap:8px}

/* Scene and side panel */
.stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;min-height:0}
.scene{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;background:radial-gradient(130% 90% at 65% 0%,var(--sky-top,#1a1a36),var(--void) 72%);border:1px solid var(--nebula-hi)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.place{position:absolute;left:12px;top:12px;margin:0;padding:.3em .8em;border-radius:999px;background:color-mix(in srgb,var(--void) 62%,transparent);font:700 .95rem/1.2 var(--font-display);letter-spacing:.02em;z-index:2}
.toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,20px);opacity:0;margin:0;padding:.45em 1em;border-radius:999px;background:var(--ember-gold);color:var(--on-ember);font:700 1rem/1.2 var(--font-display);white-space:nowrap;transition:opacity .4s,transform .4s;pointer-events:none;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.console{min-height:0;overflow:auto;background:var(--nebula);border:1px solid var(--nebula-hi);border-radius:var(--r);padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;gap:14px;margin-block:auto;width:100%}
.eyebrow{margin:0;display:flex;align-items:center;gap:.45em;font:700 .85rem/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.eyebrow svg{width:1.1em;height:1.1em;fill:currentColor}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pips{display:inline-flex;gap:7px;align-items:center}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--ember-gold);box-sizing:border-box}
.pip.on{background:var(--ember-gold)}
.pip.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--ember-gold) 30%,transparent)}
.who{margin:0;display:inline-flex;align-items:center;gap:.5em;font:800 1rem/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--who,var(--dust))}
.who::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--who,var(--dust))}
.line{margin:0;font-size:clamp(1.15rem,1.05rem + .5vw,1.4rem);line-height:1.55;max-width:38ch;text-wrap:pretty}
.say[data-who="narrator"] .line{color:color-mix(in srgb,var(--starlight) 86%,var(--dust))}
.q{margin:0;font:600 clamp(1.15rem,1.05rem + .55vw,1.45rem)/1.5 var(--font-body);max-width:40ch;text-wrap:pretty}

/* Buttons and inputs */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.actions.start{justify-content:flex-start}
.actions.split{justify-content:space-between}
.btn{font:600 1.05rem/1 var(--font-body);padding:.8em 1.3em;border-radius:999px;border:0;background:var(--ember);color:var(--on-ember);cursor:pointer;display:inline-flex;align-items:center;gap:.55em;transition:transform .15s,background .2s}
.btn:hover{background:var(--ember-gold)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--starlight);border:1.5px solid var(--nebula-hi)}
.btn.ghost:hover{border-color:var(--dust);background:var(--nebula-hi)}
.btn.small{font-size:.9rem;padding:.6em 1em}
.btn.icon{padding:.6em .8em}
.btn svg{width:1.15em;height:1.15em;fill:currentColor}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{font-size:1.3rem;padding:.9em 1.6em}
.btn.check{padding:.5em 1.1em}
.btn.check svg{width:1.9em;height:1.9em}
.kbd{font:600 .72rem/1 var(--font-body);padding:.35em .55em;border-radius:6px;background:color-mix(in srgb,var(--on-ember) 16%,transparent)}
:is(.btn,.chip,.help,.field,.opt,.playbtn):focus-visible{outline:3px solid var(--ember-gold);outline-offset:3px}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.answer .field{flex:1 1 11rem}
.field{min-width:0;box-sizing:border-box;width:100%;font:500 1.3rem/1.2 var(--font-body);padding:.6em .8em;border-radius:12px;border:2px solid var(--nebula-hi);background:var(--void);color:var(--starlight)}
.field::placeholder{color:var(--dust);opacity:.6}
.field:focus{border-color:var(--ember-gold);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:500 .95rem var(--font-body);padding:.4em .9em;border-radius:999px;border:1.5px solid var(--nebula-hi);background:transparent;color:var(--starlight);cursor:pointer}
.chip:hover{border-color:var(--dust)}
.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:14px;border:2px solid var(--nebula-hi);background:var(--void);color:var(--starlight);cursor:pointer;font:600 .92rem/1.25 var(--font-body);text-align:center}
.opt svg{width:66px;height:126px;overflow:visible}
.opt:hover{border-color:var(--ember-gold)}

/* Title and big headings */
.titlehead{display:flex;align-items:center;gap:14px}
.starmark{width:54px;height:54px;flex:none;overflow:visible;filter:drop-shadow(0 0 12px var(--ember))}
.big{margin:0;font:800 clamp(2.4rem,1.9rem + 2.6vw,3.7rem)/1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.big .hot{color:var(--ember-gold);text-shadow:0 0 24px color-mix(in srgb,var(--ember) 55%,transparent)}
.byline{margin:4px 0 0;font:700 1.05rem var(--font-display);color:var(--c-dog,#ffb46e)}

@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:minmax(0,1fr)}
  .scene{height:min(52vh,380px);min-height:260px}
  .toggles{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .slot.pop{animation:none !important}
  .bar .fill{transition:none !important}
}
/* ==== kit/puzzle-ui.css ==== */
/**
 * @file kit/puzzle-ui.css
 * @about Styles for the puzzle screen: question kind tag, fill-in blank, letter tiles, helper buttons, clues, and right or wrong feedback (a big popping cheer for a right answer).
 * @requires kit/base.css
 */
.kind{margin:0;align-self:flex-start;padding:.2em .75em;border-radius:999px;background:var(--nebula-hi);font:700 .8rem/1.4 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--c-robot,#9fd2ff)}
.q.eq{font:700 clamp(1.8rem,1.4rem + 1.6vw,2.6rem)/1.2 var(--font-type);letter-spacing:.04em}
.slot-blank{display:inline-block;min-width:4.5ch;padding:0 .35em;margin:0 .15em;border-bottom:3px solid var(--ember-gold);color:var(--ember-gold);text-align:center;font-family:var(--font-type);line-height:1.2}
.slot-blank.filled{color:var(--good);border-color:var(--good)}
.helpers{display:flex;gap:8px;flex-wrap:wrap}
.help{font:600 .95rem var(--font-body);padding:.35em .9em .35em .4em;border-radius:999px;border:1.5px solid var(--who);background:transparent;color:var(--starlight);cursor:pointer;display:inline-flex;align-items:center;gap:.4em}
.help svg{width:26px;height:26px;flex:none}
.help:hover{background:var(--nebula-hi)}
.help:disabled{opacity:.4;cursor:default;background:transparent}
.help.nudge{animation:nudge .9s ease-in-out 4}
@keyframes nudge{0%,100%{transform:scale(1);box-shadow:none}50%{transform:scale(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--who) 35%,transparent)}}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{margin:0;padding:.65em .9em;border-radius:12px;background:var(--nebula-hi);font-size:1.05rem;border-left:4px solid var(--who)}
.clue b{color:var(--who);font-weight:600}
.blanks{margin:0;font:700 1.6rem/1.2 var(--font-type);letter-spacing:.32em;color:var(--ember-gold);white-space:pre-wrap;word-break:break-word}
.feedback{margin:0;min-height:1.6em;font-size:1.1rem;font-weight:600}
.feedback.good{color:var(--good)}.feedback.oops{color:var(--oops)}
.feedback.cheer{font:800 clamp(1.4rem,1.1rem + 1vw,1.9rem)/1.2 var(--font-display);transform-origin:0 50%;animation:cheer .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes cheer{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.feedback b{font-family:var(--font-type);letter-spacing:.06em}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{min-width:2.6rem;height:2.9rem;padding-inline:.35em;box-sizing:border-box;display:grid;place-items:center;border-radius:10px;font:700 1.6rem/1 var(--font-type);text-transform:uppercase}
.tile.ice{background:linear-gradient(180deg,var(--ice,#eaf8ff),var(--ice-edge,#9bc9ec));color:var(--peng,#203457);box-shadow:inset 0 2px 0 var(--snow,#fbf7f2)}
.tile.num{background:var(--nebula-hi);color:var(--starlight);border:1.5px solid var(--c-rock,#b9d98a);font-variant-numeric:tabular-nums}
.tile.ask{border:1.5px dashed var(--ember-gold);color:var(--ember-gold);background:transparent}
.tile.word{font:600 1.15rem/1 var(--font-body);text-transform:none;padding-inline:.8em;background:var(--nebula-hi);border:1.5px solid var(--c-robot,#9fd2ff)}
@media (prefers-reduced-motion:reduce){ .help.nudge,.feedback.cheer{animation:none !important} }
/* ==== kit/typing.css ==== */
/**
 * @file kit/typing.css
 * @about Styles for typing challenges: falling word chips, the countdown, the big word display, the accuracy goal bar, the caught-star row, and the dirt clumps for digging.
 * @requires kit/base.css
 */
:root{ --dirt:#8a6a4a; --dirt-dark:#4e3a2a; --dirt-text:#fbeedd; }

/* Falling words */
.arena{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fw{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:.45em;padding:.38em .8em;border-radius:999px;background:color-mix(in srgb,var(--nebula) 88%,transparent);border:2px solid var(--nebula-hi);font:700 clamp(1.1rem,.95rem + .8vw,1.65rem)/1 var(--font-type);color:var(--starlight);white-space:pre;will-change:transform;box-shadow:0 0 18px -6px var(--c-robot,#9fd2ff)}
.fw.target{border-color:var(--ember-gold);box-shadow:0 0 24px -4px var(--ember)}
.fw .ok{color:var(--good)}.fw .cur{box-shadow:inset 0 -3px 0 var(--ember-gold)}
.fw-star{width:.8em;height:.8em;flex:none;background:var(--ember-gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.fw.caught{transition:transform .5s ease-in,opacity .5s;opacity:0}
.fw.lost{transition:opacity .6s,filter .6s;opacity:0;filter:grayscale(1)}
.fw.shake{animation:fwshake .25s}
@keyframes fwshake{0%,100%{margin-left:0}30%{margin-left:-5px}60%{margin-left:5px}}

/* Countdown */
.countdown{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.countdown span{font:800 clamp(4rem,10vw,7.5rem)/1 var(--font-display);color:var(--ember-gold);text-shadow:0 0 30px color-mix(in srgb,var(--ember) 70%,transparent);animation:countpop .75s ease-out both}
.countdown .go{font-size:clamp(2.6rem,7vw,5rem)}
@keyframes countpop{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:.95}}

/* Typing display */
.bigword{margin:0;font:700 clamp(2.2rem,1.6rem + 2.6vw,3.4rem)/1.25 var(--font-type);letter-spacing:.05em;min-height:1.3em;white-space:pre-wrap;word-break:break-word}
.bigword .todo{color:var(--dust);opacity:.6}.bigword .ok{color:var(--good)}.bigword .cur{color:var(--starlight);box-shadow:inset 0 -4px 0 var(--ember-gold)}
.bigword .wait{display:inline-flex;gap:6px}
.bigword .wait i{width:.5em;height:.5em;border-radius:50%;background:var(--dust);animation:dot 1s infinite}
.bigword .wait i:nth-child(2){animation-delay:.15s}.bigword .wait i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
.target{margin:0;font:700 clamp(1.8rem,1.4rem + 2vw,2.8rem)/1.35 var(--font-type);letter-spacing:.04em;white-space:pre-wrap;word-break:break-word}
.target .todo{color:var(--dust);opacity:.55}.target .ok{color:var(--good)}.target .cur{color:var(--starlight);box-shadow:inset 0 -4px 0 var(--ember-gold)}

/* Accuracy goal */
.goal{padding-top:22px}
.goal-bar{position:relative;height:16px;border-radius:999px;background:var(--void);border:1px solid var(--nebula-hi)}
.goal-fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:var(--good);transition:width .25s,background .25s}
.goal-fill.low{background:var(--warn)}
.goal-mark{position:absolute;top:-6px;bottom:-6px;left:85%;width:3px;border-radius:2px;background:var(--starlight)}
.goal-flag{position:absolute;left:85%;top:-24px;transform:translateX(-50%);font:700 .8rem/1 var(--font-display);color:var(--starlight);white-space:nowrap}
.bigpct{margin:0;font:400 clamp(1.8rem,1.4rem + 1.8vw,2.6rem)/1 var(--font-arcade);color:var(--good)}
.bigpct.low{color:var(--warn)}
.starrow{display:flex;gap:6px;flex-wrap:wrap}
.st{width:20px;height:20px;background:var(--nebula-hi);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.st.caught{background:var(--ember-gold)}
.st.lost{background:var(--dust);opacity:.35}
.meter{margin:0;display:flex;gap:18px;flex-wrap:wrap;color:var(--dust);font-variant-numeric:tabular-nums}
.meter b{color:var(--starlight);font-weight:600}

/* Digging */
.digtip{margin:0;font:700 clamp(1.1rem,1rem + .5vw,1.35rem)/1.3 var(--font-display);color:var(--ember-gold)}
.digrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shovel{width:46px;height:46px;flex:none}
.clods{display:flex;gap:12px;flex-wrap:wrap}
.clod{padding:.7em 1.1em;border-radius:46% 54% 40% 60%/60% 45% 55% 40%;background:radial-gradient(circle at 35% 30%,var(--dirt),var(--dirt-dark));font:700 clamp(1.5rem,1.2rem + 1.2vw,2rem)/1.1 var(--font-type);color:var(--dirt-text);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:transform .2s}
.clod .todo{opacity:.7}.clod .ok{color:var(--good)}.clod .cur{box-shadow:inset 0 -3px 0 var(--ember-gold)}
.clod.cur{outline:3px solid var(--ember-gold);outline-offset:3px}
.clod.gone{animation:crumble .45s forwards}
.clod.shake{animation:fwshake .25s}
@keyframes crumble{to{transform:scale(.2) rotate(20deg);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .fw.shake,.countdown span,.clod.gone,.clod.shake,.bigword .wait i{animation:none !important}
  .fw.caught,.fw.lost{transition:none !important}
}
/* ==== kit/scoreboard.css ==== */
/**
 * @file kit/scoreboard.css
 * @about Arcade look for the high score board, the name entry box, and the end-of-game score card.
 * @requires kit/base.css
 */
.board{font-family:var(--font-arcade);background:color-mix(in srgb,var(--void) 84%,transparent);border:2px solid var(--ember-gold);border-radius:14px;padding:16px 18px;box-shadow:0 0 30px -10px var(--ember);color:var(--starlight);box-sizing:border-box}
.board h3{margin:0 0 14px;font:400 .95rem/1.4 var(--font-arcade);color:var(--ember-gold);text-align:center;letter-spacing:.08em}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.board li{display:grid;grid-template-columns:2.8em minmax(0,1fr) auto;gap:10px;font-size:.7rem;line-height:1.6;align-items:baseline}
.board .rk{color:var(--dust)}
.board .nm{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-variant-numeric:tabular-nums;color:var(--ember-gold);text-align:right}
.board li.first .nm{color:var(--ember-gold)}
.board li.me,.board li.me .sc,.board li.me .nm{color:var(--good)}
.board li.me{animation:blinkrow 1s steps(2) 6}
@keyframes blinkrow{50%{opacity:.35}}
.board li.empty{opacity:.4}
.board .note{margin:14px 0 0;font:500 .82rem/1.4 var(--font-body);color:var(--dust);text-align:center}
.arcade-field{font:400 1rem/1.4 var(--font-arcade);text-transform:uppercase;letter-spacing:.06em}
.scorecard{display:grid;gap:6px;background:var(--void);border:1.5px solid var(--nebula-hi);border-radius:14px;padding:12px 14px}
.sc-row{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sc-row span:last-child{font:400 .85rem var(--font-arcade);color:var(--ember-gold);font-variant-numeric:tabular-nums}
.sc-total{border-top:1px dashed var(--nebula-hi);padding-top:8px;font-weight:600}
.sc-total span:last-child{font-size:1.15rem}
.rankmsg{margin:0;font:400 1rem/1.4 var(--font-arcade);color:var(--good);min-height:1.4em}
@media (prefers-reduced-motion:reduce){ .board li.me{animation:none !important} }
/* ==== kit/jukebox.css ==== */
/**
 * @file kit/jukebox.css
 * @about Styles for the jukebox song list and the "New song!" title.
 * @requires kit/base.css
 */
.jukebox{display:flex;flex-direction:column;gap:8px}
.jlist{display:flex;flex-direction:column;gap:6px}
.track-row{display:flex;align-items:center;gap:12px;padding:.5em .7em;border-radius:12px;background:var(--nebula-hi)}
.track-row.locked{background:transparent;border:1.5px dashed var(--nebula-hi);color:var(--dust)}
.track-row .tt{flex:1;min-width:0;font-weight:600;line-height:1.3}
.track-row .tw{display:block;font-size:.8rem;font-weight:400;color:var(--dust)}
.playbtn{flex:none;width:2.3rem;height:2.3rem;border-radius:50%;border:0;background:var(--ember);color:var(--on-ember);display:grid;place-items:center;cursor:pointer}
.playbtn svg{width:14px;height:14px}
.playbtn.on{background:var(--good)}
.note-ic{width:1.1rem;height:1.1rem;flex:none;fill:var(--dust)}

function heroDraw(ctx, x, y, T, hero) {
  if (hero.mode === "ship") {
    ctx.save(); ctx.translate(x, y - T * .3); ctx.rotate(Math.max(-.5, Math.min(.5, -hero.vy * .05)));
    drawImg(ctx, shipImg(true), 0, 0, T * 1.15, "center"); ctx.restore();
    return;
  }
  const pose = !hero.grounded ? "hop" : (Math.floor(hero.t / 110) % 2 ? "run1" : "run2");
  ctx.save(); ctx.translate(x, y);
  if (!hero.grounded) ctx.rotate(Math.max(-.3, Math.min(.3, -hero.vy * .018)));
  drawImg(ctx, heroImg({ pose, face: "smile" }), 0, 0, T * 1.2);
  ctx.restore();
}
function startRun(opts) {
  stopMode(); mode = "run";
  stageEl.classList.add("wide");
  const th = THEMES[opts.theme] || THEMES.hub;
  const ctl = Kit.runner.play(cv, {
    gen: opts.gen, theme: th, tip: opts.tip,
    drawBackground: (ctx, v) => nebula.draw(ctx, { ...v, dpr: Math.min(2, window.devicePixelRatio || 1) }, { theme: opts.theme, shadow: opts.shadow ? { x: .78, k: .9, lantern: false } : null }),
    drawHero: heroDraw,
    autopilot: () => window.__mgsAutopilot || false,
    speedup: () => window.__mgsSpeedup || 1,
    onAttempt: opts.onAttempt, onCrash: opts.onCrash, onCollect: opts.onCollect, onMode: opts.onMode, onFinish: opts.onFinish
  });
  runCtl = ctl;
  return ctl;
}

/* Obstacle runs */
async function countdown(alive) {
  const el = $("#countdown");
  for (const n of ["3", "2", "1"]) { if (!alive()) return false; el.innerHTML = `<span>${n}</span>`; sfx.beep(); await Kit.util.wait(600); }
  if (!alive()) return false;
  el.innerHTML = `<span class="go">GO!</span>`; sfx.liftoff();
  setTimeout(() => { if (el.querySelector(".go")) el.innerHTML = ""; }, 600);
  return true;
}
function runPortal({ theme, name, level, length, pieces, secret, extraShip, shadow, onPiecePage, done }) {
  const speed = RUN_SPEED[level - 1];
  const gen = Kit.runner.generate({ chunks: Kit.levels.runner, level, speed, length: speed * length, pieces, secret, extraShip });
  $("#place").textContent = name;
  const tok = flow.token(), firstRun = !S.tipped;
  startStage(); applyStage({ theme, face: "smile" }); stageEl.classList.add("wide"); blurActive();
  const ui = $("#runUi");
  let cpOn = false;
  function turnOnCp() {
    if (cpOn || !runCtl) return; cpOn = true; runCtl.checkpoints(true);
    const b = $("#cpBtn"); if (b) { b.classList.remove("nudge"); b.classList.add("on"); b.setAttribute("aria-pressed", "true"); b.blur(); }
    toast("Checkpoints on! Crash, and you start from the last one.");
  }
  function showCp() {
    if (ui.querySelector("#cpBtn")) return;
    ui.innerHTML = `<button type="button" class="btn small nudge" id="cpBtn" aria-pressed="false">${ICON.check} Checkpoints <span class="kbd">C</span></button>`;
    $("#cpBtn").addEventListener("click", turnOnCp);
  }
  const cKey = e => { if ((e.key === "c" || e.key === "C") && ui.querySelector("#cpBtn")) turnOnCp(); };
  document.addEventListener("keydown", cKey);
  flow.setCleanup(() => document.removeEventListener("keydown", cKey));
  countdown(() => flow.alive(tok)).then(ok => {
    if (!ok) return;
    startRun({
      gen, theme, shadow, tip: firstRun ? "Space, Up, or click to hop. His hop is tiny!" : "",
      onCrash: n => { if (n === 1 && firstRun) toast("Ouch! Back to the start."); if (n >= 3) showCp(); },
      onCollect: o => { if (o.k === "x" && onPiecePage) onPiecePage(); },
      onMode: m => { if (m === "ship" && !S.shipTip) { S.shipTip = true; save(); toast("Ship mode! Hold to fly up."); } },
      onFinish: res => { document.removeEventListener("keydown", cKey); done(res); }
    });
    if (firstRun) { S.tipped = true; save(); }
    blurActive();
  });
}
function runOutcome(res) { return res.usedCheckpoints ? "gaveup" : res.crashes <= 1 ? "clean" : res.crashes <= 4 ? "ok" : "struggle"; }
function renderRun(st) {
  const P = PORTALS[st.p], [rows, cols] = JIG_GRID[skills.level("jigsaw")];
  runPortal({
    theme: P.theme, name: P.name, level: skills.level("run"), length: 22, pieces: rows * cols, secret: true,
    onPiecePage: () => {
      const i = PORTAL_ORDER.indexOf(st.p);
      if (!S.pages.includes(i)) { S.pages.push(i); save(); }
      toast("A secret page! Someone's diary...");
    },
    done: res => {
      const pts = res.usedCheckpoints ? 100 + 5 * res.pieces : Math.max(100, 400 + 15 * res.pieces - 20 * res.crashes);
      S.stats.pts += pts; S.stats.runs[st.p] = { crashes: res.crashes, pieces: res.pieces, total: res.piecesTotal, checkpoints: res.usedCheckpoints, secret: res.secret };
      skills.record("run", runOutcome(res)); save();
      afterRun(P, res, `${res.pieces} of ${res.piecesTotal} memory pieces`);
    }
  });
}

function renderDeduce(st) {
  const D = DEDUCE[st.n];
  startStage(); applyStage({ face: "think" });
  const order = shuffle(D.opts.map((t, i) => i));
  let wrong = 0, done = false;
  panel.innerHTML = `<div class="card">
    <div class="headrow"><p class="eyebrow">Solve the mystery</p>${Kit.ui.pips(st.n, 4)}</div>
    <p class="q">${esc(D.q)}</p>
    <div class="choices">${order.map((i, k) => `<button type="button" class="choice" data-i="${i}"><span class="n">${k + 1}</span>${esc(D.opts[i])}</button>`).join("")}</div>

    <p class="feedback" id="fb" aria-live="assertive"></p>
  </div>`;
  const choose = b => {
    if (done || b.disabled) return;
    const fb = $("#fb");
    if (Number(b.dataset.i) === D.a) {
      done = true; b.classList.add("yes"); panel.querySelectorAll(".choice").forEach(x => { x.disabled = true; });
      S.stats.mystery.right++; S.stats.pts += wrong ? 50 : 150; save();
      sfx.right(); express("happy", 2000); hop();
      fb.className = "feedback good cheer"; fb.textContent = pick(CHEERS);
      const t = flow.token(); setTimeout(() => { if (flow.alive(t)) next(); }, 1700);

      b.classList.add("no"); b.disabled = true; sfx.wrong(); express("think", 1800);
      fb.className = "feedback oops"; fb.textContent = D.nope;
      const C = CLUES[D.clue];
      $("#nope").innerHTML = `<p class="clue-note"><b>Clue ${C.n}:</b> ${esc(C.short)}</p>`;
    }
  };
  optionKeys(".choice", choose);
}

/* Ending */
// Score = run, jigsaw, clue word, and mystery points + 20 x typing words per minute + 5 x typing accuracy percent + 250 per secret page.
function computeScore() {
  const t = S.stats.typing;
  const acc = t.hits + t.misses ? Math.round(t.hits / (t.hits + t.misses) * 100) : 0;
  const wpm = t.ms > 0 ? Math.min(150, Math.round((t.chars / 5) / (t.ms / 60000))) : 0;
  const pagePts = 250 * S.pages.length, gamePts = S.stats.pts || 0;
  return { acc, wpm, gamePts, speedPts: wpm * 20, accPts: acc * 5, pagePts, total: gamePts + wpm * 20 + acc * 5 + pagePts };
}
function renderEnd() {
  store.del(KEYS.save); active = false;
  startStage(); playSong("homeStomp"); express("happy", 4000); hop();
  const sc = computeScore();
  panel.innerHTML = `<div class="card end">
    <h2 class="big">T-Rexy is <span class="hot">home!</span></h2>
    ${S.pages.length === 4 ? `<p class="secret-end">Secret ending! Nova's diary had one more page: a crayon drawing of her and T-Rexy, labeled BEST FRIENDS (probably).</p>` : ""}
    <div class="scorecard" aria-label="Your score">
      <p class="sc-row"><span>Runs, puzzles, and clues</span><span>${sc.gamePts}</span></p>
      <p class="sc-row"><span>Typing speed: ${sc.wpm} words per minute</span><span>${sc.speedPts}</span></p>
      <p class="sc-row"><span>Typing accuracy: ${sc.acc}%</span><span>${sc.accPts}</span></p>
      <p class="sc-row"><span>Secret pages: ${S.pages.length} of 4</span><span>${sc.pagePts}</span></p>
      <p class="sc-row sc-total"><span>Score</span><span>${sc.total}</span></p>
    </div>
    <div class="levels">${Object.keys(SKILLS).map(k => `<span class="lvl"><b>${SKILL_NAME[k]}</b> level ${skills.level(k)} of ${SKILLS[k].max}</span>`).join("")}</div>
    <form class="answer" id="hsForm" autocomplete="off">
      <label class="sr" for="hsName">Your name for the high score board</label>
      <input id="hsName" class="field arcade-field" maxlength="10" placeholder="YOUR NAME">
      <button class="btn check" type="submit">${ICON.check}<span class="sr">Save score</span></button>
    </form>
    <p class="rankmsg" id="rankMsg"></p>
    <div class="board end-board" data-scoreboard></div>
    <div class="actions start"><button class="btn ghost" type="button" id="againBtn">${ICON.retry} Play again</button></div>
  </div>`;
  board.render();
  $("#againBtn").addEventListener("click", () => { S = fresh(); paintHud(); renderTitle(); });
  $("#hsForm").addEventListener("submit", async e => {
    e.preventDefault();
    const nm = $("#hsName").value.replace(/[^A-Za-z0-9 ]/g, "").trim().slice(0, 10);
    if (!nm) { $("#hsName").focus(); return; }
    $("#hsForm").querySelectorAll("input,button").forEach(x => { x.disabled = true; });
    const rank = await board.save({ name: nm, score: sc.total, pages: S.pages.length, wpm: sc.wpm, acc: sc.acc, levels: skills.snapshot(), at: new Date().toISOString() });
    $("#rankMsg").textContent = rank && rank <= 10 ? `#${rank}!` : "Saved!";
    sfx.join(); express("happy", 2500); hop();
    const ab = $("#againBtn"); ab.className = "btn"; focusSoon(ab);
  });
  focusSoon($("#hsName"));
}

// Tapping T-Rexy in a story scene: during a puzzle he helps (Scan or Fix one); otherwise he just hops.
cv.addEventListener("click", e => {
  if (mode !== "stage") return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  const hx = ST.ship ? .22 : .26;
  if (Math.abs(x - hx) < .12 && y > .4 && y < .9) { if (heroTap) heroTap(); else { hop(); express("happy", 1200); sfx.key(); } }
});
/* ==== games/mini-game-survival/boot.js ==== */
/**
 * @file games/mini-game-survival/boot.js
 * @about Starts Mini Game Survival: connects each story step type to its screen, resumes saved games (rebuilding the scene from the story so far), turns on Enter-to-continue, and keeps the game going through live page updates.
 * @requires kit/flow.js, games/mini-game-survival/story.js, games/mini-game-survival/screens.js
 */
const flow = Kit.flow.create({
  steps: STEPS,
  beforeStep(i) {
    $("#countdown").innerHTML = ""; heroTap = null;
    S.step = i; save();
    const t = STEPS[i] && STEPS[i].t;
    if (t !== "say" && t !== "jigsaw") hideMemory();  // a solved memory stays up while T-Rexy talks about it
  },
  handlers: {
    stage: st => { applyStage(st); return true; },
    say: renderSay,
    hub: renderHub,
    run: renderRun,
    jigsaw: renderJigsaw,
    word: renderWord,
    clue: renderClue,
    part: renderPart,
    song: renderSong,
    paint: renderPaint,
    final: renderFinal,
    deduce: renderDeduce,
    shrink: renderShrink,
    end: renderEnd
  }
});
const go = flow.go, next = flow.next;

// Rebuilds the scene for a saved game from every stage change so far.
function restore() {
  resetStage();
  flow.replay(S.step, {
    stage: st => applyStage(st),
    shrink: () => applyStage({ shadow: 0, nova: true, novaFace: "surprised", lantern: false })
  });
  paintHud();
}

Kit.ui.enterAdvances(panel);
// Read-only peek for the automated play-test: where the crash pad camera is, and which step is showing.
window.__mgs = { get step() { return S.step; }, get mode() { return mode; }, run: () => runCtl ? runCtl.state : null, hub: () => hubCtl ? { ...hubCtl.view(), heroX: hubCtl.hero.x, portals: Object.fromEntries(Object.entries(PORTALS).map(([k, p]) => [k, p.x])) } : null };
warmImages();

try { window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), active })); } catch (e) { /* not in a viewer */ }
function boot(data) {
  paintHud(); board.init();
  if (data && data.S && data.active && data.S.v === 1) { S = Object.assign(fresh(), data.S); active = true; scene.classList.remove("attract"); restore(); go(S.step); }
  else renderTitle();
}
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
} catch (e) { boot({}); }
})();
</script>
