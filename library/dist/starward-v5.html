<title>Starward v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* ==== kit/base.css ==== */
/**
 * @file kit/base.css
 * @about Core look shared by every game: color and font tokens, the one-screen layout (top bar, scene, side panel), buttons, text boxes, choice tiles, title text, and toasts. Single dark space theme by design.
 * @requires nothing
 */
:root{
  color-scheme: dark;
  --void:#0d0a24; --nebula:#191443; --nebula-hi:#271f5e; --starlight:#f1efff; --dust:#aaa5d8;
  --ember:#ff8740; --ember-gold:#ffcb5e; --on-ember:#2a1100; --good:#63e0a6; --oops:#ff7a98; --warn:#ffb86b;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --font-type:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-arcade:"Press Start 2P",ui-monospace,Menlo,monospace;
  --r:18px;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--starlight);font-family:var(--font-body);font-size:16px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-inline:16px;padding-block:12px;max-width:1340px;margin:0 auto}

/* Top bar */
.hud{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px}
.logo{margin:0;display:flex;align-items:center;gap:8px;font:800 1.5rem/1 var(--font-display);letter-spacing:.01em}
.logo svg{width:24px;height:24px;overflow:visible}
.star{fill:var(--ember-gold)}
.courage{display:flex;align-items:center;gap:10px;flex:1 1 200px;max-width:360px}
.lbl{font:700 .8rem var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.bar{flex:1;height:12px;border-radius:999px;background:var(--nebula);border:1px solid var(--nebula-hi);overflow:hidden}
.bar .fill{display:block;height:100%;width:8%;border-radius:inherit;background:linear-gradient(90deg,var(--c-robot,#9fd2ff),var(--ember-gold) 70%,var(--ember));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.pct{font:700 .95rem var(--font-display);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.crew{list-style:none;margin:0;padding:0;display:flex;gap:8px;align-items:center}
.slot{width:36px;height:36px;border-radius:50%;border:2px dashed var(--nebula-hi);display:grid;place-items:center;color:var(--dust);font:700 1rem var(--font-display);box-sizing:border-box}
.slot.on{border:2px solid var(--who);background:var(--nebula)}
.slot.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.slot svg{width:28px;height:28px}
.toggles{margin-left:auto;display:flex;gap:8px}

/* Scene and side panel */
.stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;min-height:0}
.scene{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;background:radial-gradient(130% 90% at 65% 0%,var(--sky-top,#1a1a36),var(--void) 72%);border:1px solid var(--nebula-hi)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.place{position:absolute;left:12px;top:12px;margin:0;padding:.3em .8em;border-radius:999px;background:color-mix(in srgb,var(--void) 62%,transparent);font:700 .95rem/1.2 var(--font-display);letter-spacing:.02em;z-index:2}
.toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,20px);opacity:0;margin:0;padding:.45em 1em;border-radius:999px;background:var(--ember-gold);color:var(--on-ember);font:700 1rem/1.2 var(--font-display);white-space:nowrap;transition:opacity .4s,transform .4s;pointer-events:none;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.console{min-height:0;overflow:auto;background:var(--nebula);border:1px solid var(--nebula-hi);border-radius:var(--r);padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;gap:14px;margin-block:auto;width:100%}
.eyebrow{margin:0;display:flex;align-items:center;gap:.45em;font:700 .85rem/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.eyebrow svg{width:1.1em;height:1.1em;fill:currentColor}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pips{display:inline-flex;gap:7px;align-items:center}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--ember-gold);box-sizing:border-box}
.pip.on{background:var(--ember-gold)}
.pip.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--ember-gold) 30%,transparent)}
.who{margin:0;display:inline-flex;align-items:center;gap:.5em;font:800 1rem/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--who,var(--dust))}
.who::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--who,var(--dust))}
.line{margin:0;font-size:clamp(1.15rem,1.05rem + .5vw,1.4rem);line-height:1.55;max-width:38ch;text-wrap:pretty}
.say[data-who="narrator"] .line{color:color-mix(in srgb,var(--starlight) 86%,var(--dust))}
.q{margin:0;font:600 clamp(1.15rem,1.05rem + .55vw,1.45rem)/1.5 var(--font-body);max-width:40ch;text-wrap:pretty}

/* Buttons and inputs */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.actions.start{justify-content:flex-start}
.actions.split{justify-content:space-between}
.btn{font:600 1.05rem/1 var(--font-body);padding:.8em 1.3em;border-radius:999px;border:0;background:var(--ember);color:var(--on-ember);cursor:pointer;display:inline-flex;align-items:center;gap:.55em;transition:transform .15s,background .2s}
.btn:hover{background:var(--ember-gold)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--starlight);border:1.5px solid var(--nebula-hi)}
.btn.ghost:hover{border-color:var(--dust);background:var(--nebula-hi)}
.btn.small{font-size:.9rem;padding:.6em 1em}
.btn.icon{padding:.6em .8em}
.btn svg{width:1.15em;height:1.15em;fill:currentColor}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{font-size:1.3rem;padding:.9em 1.6em}
.btn.check{padding:.5em 1.1em}
.btn.check svg{width:1.9em;height:1.9em}
.kbd{font:600 .72rem/1 var(--font-body);padding:.35em .55em;border-radius:6px;background:color-mix(in srgb,var(--on-ember) 16%,transparent)}
:is(.btn,.chip,.help,.field,.opt,.playbtn):focus-visible{outline:3px solid var(--ember-gold);outline-offset:3px}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.answer .field{flex:1 1 11rem}
.field{min-width:0;box-sizing:border-box;width:100%;font:500 1.3rem/1.2 var(--font-body);padding:.6em .8em;border-radius:12px;border:2px solid var(--nebula-hi);background:var(--void);color:var(--starlight)}
.field::placeholder{color:var(--dust);opacity:.6}
.field:focus{border-color:var(--ember-gold);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:500 .95rem var(--font-body);padding:.4em .9em;border-radius:999px;border:1.5px solid var(--nebula-hi);background:transparent;color:var(--starlight);cursor:pointer}
.chip:hover{border-color:var(--dust)}
.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:14px;border:2px solid var(--nebula-hi);background:var(--void);color:var(--starlight);cursor:pointer;font:600 .92rem/1.25 var(--font-body);text-align:center}
.opt svg{width:66px;height:126px;overflow:visible}
.opt:hover{border-color:var(--ember-gold)}

/* Title and big headings */
.titlehead{display:flex;align-items:center;gap:14px}
.starmark{width:54px;height:54px;flex:none;overflow:visible;filter:drop-shadow(0 0 12px var(--ember))}
.big{margin:0;font:800 clamp(2.4rem,1.9rem + 2.6vw,3.7rem)/1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.big .hot{color:var(--ember-gold);text-shadow:0 0 24px color-mix(in srgb,var(--ember) 55%,transparent)}
.byline{margin:4px 0 0;font:700 1.05rem var(--font-display);color:var(--c-dog,#ffb46e)}

@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:minmax(0,1fr)}
  .scene{height:min(52vh,380px);min-height:260px}
  .toggles{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .slot.pop{animation:none !important}
  .bar .fill{transition:none !important}
}
/* ==== kit/puzzle-ui.css ==== */
/**
 * @file kit/puzzle-ui.css
 * @about Styles for the puzzle screen: question kind tag, fill-in blank, letter tiles, helper buttons, clues, and right or wrong feedback.
 * @requires kit/base.css
 */
.kind{margin:0;align-self:flex-start;padding:.2em .75em;border-radius:999px;background:var(--nebula-hi);font:700 .8rem/1.4 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--c-robot,#9fd2ff)}
.q.eq{font:700 clamp(1.8rem,1.4rem + 1.6vw,2.6rem)/1.2 var(--font-type);letter-spacing:.04em}
.slot-blank{display:inline-block;min-width:4.5ch;padding:0 .35em;margin:0 .15em;border-bottom:3px solid var(--ember-gold);color:var(--ember-gold);text-align:center;font-family:var(--font-type);line-height:1.2}
.slot-blank.filled{color:var(--good);border-color:var(--good)}
.helpers{display:flex;gap:8px;flex-wrap:wrap}
.help{font:600 .95rem var(--font-body);padding:.35em .9em .35em .4em;border-radius:999px;border:1.5px solid var(--who);background:transparent;color:var(--starlight);cursor:pointer;display:inline-flex;align-items:center;gap:.4em}
.help svg{width:26px;height:26px;flex:none}
.help:hover{background:var(--nebula-hi)}
.help:disabled{opacity:.4;cursor:default;background:transparent}
.help.nudge{animation:nudge .9s ease-in-out 4}
@keyframes nudge{0%,100%{transform:scale(1);box-shadow:none}50%{transform:scale(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--who) 35%,transparent)}}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{margin:0;padding:.65em .9em;border-radius:12px;background:var(--nebula-hi);font-size:1.05rem;border-left:4px solid var(--who)}
.clue b{color:var(--who);font-weight:600}
.blanks{margin:0;font:700 1.6rem/1.2 var(--font-type);letter-spacing:.32em;color:var(--ember-gold);white-space:pre-wrap;word-break:break-word}
.feedback{margin:0;min-height:1.6em;font-size:1.1rem;font-weight:600}
.feedback.good{color:var(--good)}.feedback.oops{color:var(--oops)}
.feedback b{font-family:var(--font-type);letter-spacing:.06em}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{min-width:2.6rem;height:2.9rem;padding-inline:.35em;box-sizing:border-box;display:grid;place-items:center;border-radius:10px;font:700 1.6rem/1 var(--font-type);text-transform:uppercase}
.tile.ice{background:linear-gradient(180deg,var(--ice,#eaf8ff),var(--ice-edge,#9bc9ec));color:var(--peng,#203457);box-shadow:inset 0 2px 0 var(--snow,#fbf7f2)}
.tile.num{background:var(--nebula-hi);color:var(--starlight);border:1.5px solid var(--c-rock,#b9d98a);font-variant-numeric:tabular-nums}
.tile.ask{border:1.5px dashed var(--ember-gold);color:var(--ember-gold);background:transparent}
.tile.word{font:600 1.15rem/1 var(--font-body);text-transform:none;padding-inline:.8em;background:var(--nebula-hi);border:1.5px solid var(--c-robot,#9fd2ff)}
@media (prefers-reduced-motion:reduce){ .help.nudge{animation:none !important} }
/* ==== kit/typing.css ==== */
/**
 * @file kit/typing.css
 * @about Styles for typing challenges: falling word chips, the countdown, the big word display, the accuracy goal bar, the caught-star row, and the dirt clumps for digging.
 * @requires kit/base.css
 */
:root{ --dirt:#8a6a4a; --dirt-dark:#4e3a2a; --dirt-text:#fbeedd; }

/* Falling words */
.arena{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fw{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:.45em;padding:.38em .8em;border-radius:999px;background:color-mix(in srgb,var(--nebula) 88%,transparent);border:2px solid var(--nebula-hi);font:700 clamp(1.1rem,.95rem + .8vw,1.65rem)/1 var(--font-type);color:var(--starlight);white-space:pre;will-change:transform;box-shadow:0 0 18px -6px var(--c-robot,#9fd2ff)}
.fw.target{border-color:var(--ember-gold);box-shadow:0 0 24px -4px var(--ember)}
.fw .ok{color:var(--good)}.fw .cur{box-shadow:inset 0 -3px 0 var(--ember-gold)}
.fw-star{width:.8em;height:.8em;flex:none;background:var(--ember-gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.fw.caught{transition:transform .5s ease-in,opacity .5s;opacity:0}
.fw.lost{transition:opacity .6s,filter .6s;opacity:0;filter:grayscale(1)}
.fw.shake{animation:fwshake .25s}
@keyframes fwshake{0%,100%{margin-left:0}30%{margin-left:-5px}60%{margin-left:5px}}

/* Countdown */
.countdown{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.countdown span{font:800 clamp(4rem,10vw,7.5rem)/1 var(--font-display);color:var(--ember-gold);text-shadow:0 0 30px color-mix(in srgb,var(--ember) 70%,transparent);animation:countpop .75s ease-out both}
.countdown .go{font-size:clamp(2.6rem,7vw,5rem)}
@keyframes countpop{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:.95}}

/* Typing display */
.bigword{margin:0;font:700 clamp(2.2rem,1.6rem + 2.6vw,3.4rem)/1.25 var(--font-type);letter-spacing:.05em;min-height:1.3em;white-space:pre-wrap;word-break:break-word}
.bigword .todo{color:var(--dust);opacity:.6}.bigword .ok{color:var(--good)}.bigword .cur{color:var(--starlight);box-shadow:inset 0 -4px 0 var(--ember-gold)}
.bigword .wait{display:inline-flex;gap:6px}
.bigword .wait i{width:.5em;height:.5em;border-radius:50%;background:var(--dust);animation:dot 1s infinite}
.bigword .wait i:nth-child(2){animation-delay:.15s}.bigword .wait i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
.target{margin:0;font:700 clamp(1.8rem,1.4rem + 2vw,2.8rem)/1.35 var(--font-type);letter-spacing:.04em;white-space:pre-wrap;word-break:break-word}
.target .todo{color:var(--dust);opacity:.55}.target .ok{color:var(--good)}.target .cur{color:var(--starlight);box-shadow:inset 0 -4px 0 var(--ember-gold)}

/* Accuracy goal */
.goal{padding-top:22px}
.goal-bar{position:relative;height:16px;border-radius:999px;background:var(--void);border:1px solid var(--nebula-hi)}
.goal-fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:var(--good);transition:width .25s,background .25s}
.goal-fill.low{background:var(--warn)}
.goal-mark{position:absolute;top:-6px;bottom:-6px;left:85%;width:3px;border-radius:2px;background:var(--starlight)}
.goal-flag{position:absolute;left:85%;top:-24px;transform:translateX(-50%);font:700 .8rem/1 var(--font-display);color:var(--starlight);white-space:nowrap}
.bigpct{margin:0;font:400 clamp(1.8rem,1.4rem + 1.8vw,2.6rem)/1 var(--font-arcade);color:var(--good)}
.bigpct.low{color:var(--warn)}
.starrow{display:flex;gap:6px;flex-wrap:wrap}
.st{width:20px;height:20px;background:var(--nebula-hi);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.st.caught{background:var(--ember-gold)}
.st.lost{background:var(--dust);opacity:.35}
.meter{margin:0;display:flex;gap:18px;flex-wrap:wrap;color:var(--dust);font-variant-numeric:tabular-nums}
.meter b{color:var(--starlight);font-weight:600}

/* Digging */
.digrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shovel{width:46px;height:46px;flex:none}
.clods{display:flex;gap:12px;flex-wrap:wrap}
.clod{padding:.7em 1.1em;border-radius:46% 54% 40% 60%/60% 45% 55% 40%;background:radial-gradient(circle at 35% 30%,var(--dirt),var(--dirt-dark));font:700 clamp(1.5rem,1.2rem + 1.2vw,2rem)/1.1 var(--font-type);color:var(--dirt-text);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:transform .2s}
.clod .todo{opacity:.7}.clod .ok{color:var(--good)}.clod .cur{box-shadow:inset 0 -3px 0 var(--ember-gold)}
.clod.cur{outline:3px solid var(--ember-gold);outline-offset:3px}
.clod.gone{animation:crumble .45s forwards}
.clod.shake{animation:fwshake .25s}
@keyframes crumble{to{transform:scale(.2) rotate(20deg);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .fw.shake,.countdown span,.clod.gone,.clod.shake,.bigword .wait i{animation:none !important}
  .fw.caught,.fw.lost{transition:none !important}
}
/* ==== kit/scoreboard.css ==== */
/**
 * @file kit/scoreboard.css
 * @about Arcade look for the high score board, the name entry box, and the end-of-game score card.
 * @requires kit/base.css
 */
.board{font-family:var(--font-arcade);background:color-mix(in srgb,var(--void) 84%,transparent);border:2px solid var(--ember-gold);border-radius:14px;padding:16px 18px;box-shadow:0 0 30px -10px var(--ember);color:var(--starlight);box-sizing:border-box}
.board h3{margin:0 0 14px;font:400 .95rem/1.4 var(--font-arcade);color:var(--ember-gold);text-align:center;letter-spacing:.08em}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.board li{display:grid;grid-template-columns:2.8em minmax(0,1fr) auto;gap:10px;font-size:.7rem;line-height:1.6;align-items:baseline}
.board .rk{color:var(--dust)}
.board .nm{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-variant-numeric:tabular-nums;color:var(--ember-gold);text-align:right}
.board li.first .nm{color:var(--ember-gold)}
.board li.me,.board li.me .sc,.board li.me .nm{color:var(--good)}
.board li.me{animation:blinkrow 1s steps(2) 6}
@keyframes blinkrow{50%{opacity:.35}}
.board li.empty{opacity:.4}
.board .note{margin:14px 0 0;font:500 .82rem/1.4 var(--font-body);color:var(--dust);text-align:center}
.arcade-field{font:400 1rem/1.4 var(--font-arcade);text-transform:uppercase;letter-spacing:.06em}
.scorecard{display:grid;gap:6px;background:var(--void);border:1.5px solid var(--nebula-hi);border-radius:14px;padding:12px 14px}
.sc-row{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sc-row span:last-child{font:400 .85rem var(--font-arcade);color:var(--ember-gold);font-variant-numeric:tabular-nums}
.sc-total{border-top:1px dashed var(--nebula-hi);padding-top:8px;font-weight:600}
.sc-total span:last-child{font-size:1.15rem}
.rankmsg{margin:0;font:400 1rem/1.4 var(--font-arcade);color:var(--good);min-height:1.4em}
@media (prefers-reduced-motion:reduce){ .board li.me{animation:none !important} }
/* ==== kit/jukebox.css ==== */
/**
 * @file kit/jukebox.css
 * @about Styles for the jukebox song list and the "New song!" title.
 * @requires kit/base.css
 */
.jukebox{display:flex;flex-direction:column;gap:8px}
.jlist{display:flex;flex-direction:column;gap:6px}
.track-row{display:flex;align-items:center;gap:12px;padding:.5em .7em;border-radius:12px;background:var(--nebula-hi)}
.track-row.locked{background:transparent;border:1.5px dashed var(--nebula-hi);color:var(--dust)}
.track-row .tt{flex:1;min-width:0;font-weight:600;line-height:1.3}
.track-row .tw{display:block;font-size:.8rem;font-weight:400;color:var(--dust)}
.playbtn{flex:none;width:2.3rem;height:2.3rem;border-radius:50%;border:0;background:var(--ember);color:var(--on-ember);display:grid;place-items:center;cursor:pointer}
.playbtn svg{width:14px;height:14px}
.playbtn.on{background:var(--good)}
.note-ic{width:1.1rem;height:1.1rem;flex:none;fill:var(--dust)}
.songtitle{margin:0;display:flex;align-items:center;gap:.4em;font:800 clamp(1.6rem,1.3rem + 1.4vw,2.2rem)/1.1 var(--font-display);color:var(--ember-gold)}
.songtitle svg{width:1em;height:1em;fill:currentColor}
/* ==== assets/characters/characters.css ==== */
/**
 * @file assets/characters/characters.css
 * @about Colors, faces, and animations for every character: the robot (worried, brave, happy, surprised, thinking faces; chest spark that grows with courage), Sunny, Rigel, Professor Kepler, flames, and the hop, walk, tremble, blink, and wag motions.
 * @requires kit/base.css
 */
:root{

/* Robot parts */

.panel{stroke:var(--metal-shade);stroke-width:1.5;stroke-linecap:round;fill:none}
.glint{fill:none;stroke:var(--starlight);stroke-opacity:.5;stroke-width:1.6;stroke-linecap:round}
.eye{fill:var(--snow)}.pupil{fill:var(--void)}.spark{fill:var(--snow)}

.antenna{stroke:var(--metal-shade);stroke-width:2.5;stroke-linecap:round}
.bulb{fill:var(--c-robot);transition:fill .8s}

/* Robot faces. Base mood comes from courage (.brave); short reactions use data-face="happy | surprised | think". */

.robot.brave .brow-worried,.robot.brave .mouth-wobble{display:none}

.robot[data-face] .eyes-normal,.robot[data-face] .brow-worried,.robot[data-face] .brow-brave,.robot[data-face] .mouth-wobble,.robot[data-face] .mouth-smile{display:none}

.robot[data-face="surprised"] :is(.eyes-wide,.brow-up,.mouth-o){display:inline}

.white{fill:var(--snow)}.tan{fill:var(--tan)}.iris{fill:var(--iris)}.nose{fill:var(--nose)}.tongue{fill:var(--tongue)}
.toe{stroke:var(--toe);stroke-width:.9;stroke-linecap:round}

.stone{fill:var(--stone)}.stone-sh{fill:var(--stone-sh)}.moss{fill:var(--moss)}

/**

:root{

/* World palettes */
.scene[data-world="lumina"]{--ground-a:#565878;--ground-b:#272640;--sky-top:#1a1a36}
.scene[data-world="luminaLit"]{--ground-a:#8fd26a;--ground-b:#3d8a52;--sky-top:#2b3f7a;--orb-a:#fff2b0;--orb-b:#ffb24d;--wall:#f1d9b5;--roof:#c9573f;--win:#ffcb5e;--leaf:#5cc46e;--trunk:#7a4f33;--worm:#ffe58a;--dome:#e7d6b0}
.scene[data-world="nimbus"]{--ground-a:#f6b6de;--ground-b:#a866c0;--sky-top:#3a1f5e;--orb-a:#ffd3f0;--orb-b:#b45fa8}

/* Ground */

.stop-b{stop-color:var(--ground-b);transition:stop-color 1s}

/* ==== kit/util.js ==== */
/**
 * @file kit/util.js
 * @about Small helpers every game uses: finding elements, random picks, answer matching, and safe browser storage.
 * @provides Kit.util { $, wait, shuffle, sample, pick, rint, clamp, esc, norm, squash, lev, cleanName, store }
 * @requires nothing
 */
(function (Kit) {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sample = (arr, n) => shuffle(arr.slice()).slice(0, n);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Lowercase, drop punctuation and a leading "a / an / the / mount" so "The Moon" matches "moon".
  const norm = s => String(s).toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim()
    .replace(/^(a|an|the|your|my|its|his|her|mount|mt) /, "");
  const squash = s => norm(s).replace(/ /g, "");

  // Edit distance between two words. Used to forgive one small spelling slip.
  function lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (x, i) => i);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }

  // Tidy a typed name: letters, numbers, spaces, apostrophes, hyphens; capital first letter.
  const cleanName = (v, max = 14) => {
    const t = String(v || "").replace(/[^A-Za-z0-9 '\-]/g, "").replace(/\s+/g, " ").trim().slice(0, max);
    return t ? t[0].toUpperCase() + t.slice(1) : "";
  };

  // Browser storage that never throws (private windows and previews can block it).
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }

/**
 * @file kit/ui.js
 * @about Shared screen helpers: the main Next button, progress dots, toasts, focus, Enter-to-continue, and reading theme colors for canvas drawing.
 * @provides Kit.ui { reduced, focusSoon, bindPrimary, nextBtn, pips, toaster, enterAdvances, tokens, blurActive }

  // Wires the panel's [data-primary] button. Clicks in the first 220 ms are ignored so a held Enter key can't skip a screen.
  function bindPrimary(panel, fn) {
    const b = panel.querySelector("[data-primary]"); if (!b) return;
    const made = performance.now();

  // Three dots that fill in as challenges are finished.
  const pips = (done, total = 3) => `<span class="pips" role="img" aria-label="${done} of ${total} done">${Array.from({ length: total }, (x, i) => `<i class="pip ${i < done ? "on" : i === done ? "cur" : ""}"></i>`).join("")}</span>`;

  function enterAdvances(panel) {

      if (e.key !== "Enter") return;
      if (e.repeat) { e.preventDefault(); return; }

      if (tag === "INPUT" || tag === "BUTTON" || tag === "TEXTAREA") return;

  word: ["gen", "word", "math"], missing: ["gen", "missing", "math"], place: ["gen", "place", "math"], round: ["gen", "round", "math"], pattern: ["gen", "pattern", "math"]
};
const SCRAMBLE_LENGTHS = { 1: [4, 4, 5], 2: [4, 5, 6], 3: [5, 6, 7] };

// The plan picks question KINDS when a game starts, for variety. The question itself is chosen when it appears, so it fits the level at that moment.
function makePlan() {
  const textKinds = shuffle(["riddle", "blank", "odd", pick(["riddle", "blank"])]);
  const mathKinds = shuffle(["word", "word", "missing", "place", "round", "pattern"]).slice(0, 4);
  const sites = {};
  PART_SITES.forEach((s, i) => { sites[s.id] = [textKinds[i], mathKinds[i]]; });
  return {
    sites,
    nimbus: shuffle(["riddle", "blank", "odd", "word"]).slice(0, 3),
    glacia: ["scramble", "scramble", "scramble"],
    meridian: shuffle(["earth", "earth", pick(["pattern", "order"])]),
    corona: shuffle(["space", "space", Math.random() < .5 ? "blank" : "order"]),
    digs: Object.fromEntries(PART_SITES.map(s => [s.id, sample(Kit.words.dig, 3)]))
  };
}

const fresh = () => ({
  v: 4, robot: "", step: 0, world: "lumina", site: "pad", courage: 8, crew: [], seen: [], floors: 0,
  plan: null, asked: {}, found: {}, paint: "", siteProg: {}, mapPos: null, mapMoved: false,
  stats: { solved: 0, shown: 0, hints: 0, pts: 0, legs: {} }
});
let S = fresh();
let active = false;
let picker = null;

function newPicker() {
  picker = Kit.questions.createPicker({ seenKey: KEYS.seen });
  Object.values(S.asked || {}).forEach(p => picker.reserve(p));
}
// Returns the question for a slot, choosing it now (at the current level) if it hasn't been asked yet.
function ask(slot, kind, n = 0) {
  if (S.asked[slot]) return S.asked[slot];
  const [src, name, skill] = SOURCES[kind] || SOURCES.word;
  const L = skills.level(skill);
  let p = null;
  if (src === "bank") p = picker.bank(name, L);
  else if (src === "gen") p = picker.gen(name, L);
  else { const len = (SCRAMBLE_LENGTHS[L] || SCRAMBLE_LENGTHS[2])[n] || 5; p = picker.bank("scramble", L, x => x.len === len) || picker.bank("scramble", L); }
  if (!p) p = picker.gen("word", skills.level("math"));
  p = { ...p, skill };
  S.asked[slot] = p; save();
  return p;
}

function save() { if (active) store.set(KEYS.save, S); }
function loadSave() {
  const d = store.get(KEYS.save, null);
  if (d && d.v === 4 && d.robot && d.step > 0 && d.step < STEPS.length - 1 && d.plan && d.plan.sites) return d;
  return null;
}

const shipCfg = () => ({ nose: S.found.nose, fins: S.found.fins, boost: S.found.boost, engine: S.found.engine, paint: S.paint });
const allFound = () => PART_ORDER.every(p => S.found[p]);
const nextBtn = (label = "Next", icon = ICON.go, cls = "") => Kit.ui.nextBtn(label, icon, cls);
const bindPrimary = fn => Kit.ui.bindPrimary(panel, fn);

/**
 * @file games/starward/scene.js

 * @requires kit/starfield.js, kit/music.js, kit/audio.js, assets/characters/puppy.js, assets/characters/portraits.js, assets/rocket/rocket.js, games/starward/state.js

const stars = Kit.starfield.create($("#stars"), { color: TOK.starlight });

$("#dogArt").innerHTML = Kit.art.puppy();

/* Sound and music */

Kit.audio.setEnabled(soundOn);

  soundBtn.textContent = soundOn ? "Sound on" : "Sound off"; soundBtn.setAttribute("aria-pressed", String(soundOn));

/* Characters */
const charEl = who => scene.querySelector(`.char[data-who="${who}"]`);

  setTimeout(() => h.classList.remove(kind), 600);
}
let faceTimer = 0;
// Shows a face for a moment: "happy", "surprised", or "think". ms = 0 keeps it.
function express(face, ms = 1700) {

}
function appear(who) { if (!S.seen.includes(who)) S.seen.push(who); const c = charEl(who); if (c) c.classList.add("in"); describeScene(); }

function walkTo(id, instant) {
  const site = SITES.find(s => s.id === id) || SITES[0];
  S.site = site.id;
  const spin = $("#spin");
  const d = ((-site.angle - spinAngle) % 360 + 540) % 360 - 180;
  spinAngle += d;
  if (instant || reduced || Math.abs(d) < 1) {
    spin.style.transition = "none"; spin.style.transform = `rotate(${spinAngle}deg)`; void spin.getBoundingClientRect(); spin.style.transition = "";
    return Promise.resolve();
  }
  spin.style.transform = `rotate(${spinAngle}deg)`;

/**
 * @file games/starward/lumina.js
 * @about Exploring Lumina: the walkable map, the three challenges at each place (a word puzzle, a math puzzle, then digging), choosing each rocket part's style, and building and painting the ship at the launch pad.
 * @requires kit/topdown-map.js, kit/typing-challenges.js, assets/map/lumina-map.js, assets/characters/robot-topdown.js, games/starward/scene.js

const LM = Kit.art.luminaMap;

  const img = new Image(); img.onload = () => { padImg = img; };

const map = Kit.topdownMap.create({
  canvas: $("#mapCanvas"), width: MAP_W, height: MAP_H, speed: 230, enterRadius: 52,
  bounds: { minX: 24, maxX: MAP_W - 24, minY: 96, maxY: MAP_H - 10 },
  sites: SITES, font: MAPFONT, colors: { light: TOK.snow, dark: TOK.void },
  fog: {
    rgb: "7,6,22",
    alpha: () => .8 - PART_ORDER.filter(p => S.found[p]).length * .07,
    holes: pos => {
      const pad = SITES[0], all = allFound();
      return [
        { x: pos.x, y: pos.y - 40, r: 118 + S.courage * 1.1 },
        { x: pad.x, y: pad.y - 30, r: all ? 110 : 70, a: all ? 1 : .5 },
        ...PART_SITES.map(s => S.found[s.part] ? { x: s.x, y: s.y - 30, r: 95, a: .85 } : { x: s.x, y: s.y - s.beacon, r: 34, a: .9 })
      ];
    }
  },
  drawWorld(c, t) {
    LM.drawGround(c, t, DECOR, TOK);
    LM.drawPaths(c, SITES[0], PART_SITES);
    LM.drawCrater(c, SITES[1], t, TOK);
    LM.drawObservatory(c, SITES[2], TOK);
    LM.drawGrove(c, SITES[3], t, TOK);
    LM.drawVillage(c, SITES[4], t, TOK, MAPFONT);
    LM.drawPad(c, SITES[0], TOK, padImg);
  },
  drawPlayer: (c, x, y, t, m) => Kit.art.drawRobotTop(c, x, y, t, m, { tokens: TOK, glow: .35 + S.courage / 100 * .6 }),
  drawAbove(c, t) {
    PART_SITES.forEach(s => LM.drawBeacon(c, s, t, { found: !!S.found[s.part], progress: S.siteProg[s.id] || 0, reduced }, TOK));
    if (allFound()) LM.drawPadRing(c, SITES[0], t, TOK);
  },
  showHint: () => !S.mapMoved,
  onMove: () => { S.mapMoved = true; },
  onArrive: arriveAt

function mapStart() {

function mapStop() {

function renderExplore() {

// Side panel while walking: the half-built rocket and four part slots.
function renderRoam() {
  panel.innerHTML = `<div class="card roam">
    <p class="eyebrow">Lumina</p>
    <div class="roam-ship">${R.box(R.svg(shipCfg(), { ghost: true }))}</div>
    <ul class="partslots" aria-label="Ship parts">${PART_ORDER.map(p => `<li class="${S.found[p] ? "got" : ""}" title="${PARTS[p].name}" aria-label="${PARTS[p].name}${S.found[p] ? ", found" : ""}">${R.partIcons[p]}</li>`).join("")}</ul>
  </div>`;
  panel.querySelectorAll(".partslots li").forEach(li => {
    const got = li.classList.contains("got");
    li.querySelectorAll(".pi").forEach(p => { p.setAttribute("fill", got ? TOK.gold : "none"); p.setAttribute("stroke", got ? "none" : "#8d88c8"); p.setAttribute("stroke-width", "1.6"); p.setAttribute("stroke-dasharray", got ? "" : "3 3"); });

function arriveAt(site) {
  if (site.id === "pad") {
    if (!allFound()) return;
    map.busy = true; S.site = "pad"; S.mapPos = map.pos; sfx.arrive(); save(); next(); return;
  }
  if (S.found[site.part]) return;
  map.busy = true; S.site = site.id; S.mapPos = map.pos; sfx.arrive(); save();
  renderSiteTask(site);
}
function leaveSite(site) {
  flow.cleanupNow();
  map.stepOutOf(site); S.mapPos = map.pos; save(); map.busy = false; renderRoam();
}
function siteHead(site, done) {
  return `<div class="headrow"><p class="eyebrow">${esc(site.name)}</p><div style="display:flex;align-items:center;gap:12px">${pips(done)}<span class="target-ship">${R.box(R.svg(shipCfg(), { ghost: true, hl: site.part }))}</span></div></div>`;
}
// Three challenges per place: word puzzle, math puzzle, then dig.
function renderSiteTask(site) {
  const prog = S.siteProg[site.id] || 0;
  if (prog >= 3) return revealPart(site);
  if (prog === 2) return renderDig(site);
  const p = ask(`${site.id}-${prog}`, S.plan.sites[site.id][prog]);
  runPuzzle(p, { head: siteHead(site, prog), leave: () => leaveSite(site), site }, () => {
    S.siteProg[site.id] = prog + 1; save(); renderSiteTask(site);
  });

function renderDig(site) {

    onBack: () => leaveSite(site),
    onWord: () => map.burst(site.x, site.y - 20, TOK.dirt, 16),
    onDone: st => {
      flow.setCleanup(null);
      const L = S.stats.legs.dig || { hits: 0, misses: 0, typeMs: 0, typeChars: 0, caught: 0, n: 0 };
      L.hits += st.hits; L.misses += st.misses; L.typeMs += st.ms; L.typeChars += st.chars;
      S.stats.legs.dig = L; S.siteProg[site.id] = 3; save();
      map.burst(site.x, site.y - 30, TOK.gold, 24);
      setTimeout(() => { if (map.busy && S.site === site.id) revealPart(site); }, 450);
    }
  });
  flow.setCleanup(stop);
}
function revealPart(site) {
  const key = site.part, part = PARTS[key];
  express("surprised", 1500); sfx.found(); toast(`You found the ${part.name}!`);
  panel.innerHTML = `<div class="card">
    <p class="eyebrow">${esc(part.name)}</p>
    <div class="options">${part.options.map(([id, label]) => {
      const cfg = { ...shipCfg(), [key]: id };
      if (key === "engine" && !cfg.boost) cfg.boost = "one";
      return `<button type="button" class="opt" data-opt="${id}">${R.box(R.svg(cfg, { ghost: true, flame: key === "engine" || key === "boost" }))}<span>${esc(label)}</span></button>`;
    }).join("")}</div>
  </div>`;
  panel.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    S.found[key] = b.dataset.opt; addCourage(3); express("happy"); sfx.right(); paintRockets();
    map.burst(site.x, site.y - 30, TOK.gold, 20);
    map.stepOutOf(site); S.mapPos = map.pos; map.busy = false; save(); renderRoam();
  }));
  focusSoon(panel.querySelector(".opt"));
}
function renderBuild() {
  S.site = "pad";
  panel.innerHTML = `<div class="card">
    <p class="eyebrow">Launch Pad</p>
    <div class="options">${PAINT_ORDER.map(id => `<button type="button" class="opt" data-paint="${id}">${R.box(R.svg({ ...shipCfg(), paint: id }, { flame: true }))}<span>${esc(PAINTS[id].label)}</span></button>`).join("")}</div>
  </div>`;
  panel.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    S.paint = b.dataset.paint; paintRockets(); express("happy"); sfx.found(); save();
    panel.innerHTML = `<div class="card">
      <p class="eyebrow">${esc(PAINTS[S.paint].label)}</p>
      <div class="shipshow">${R.box(R.svg(shipCfg(), { flame: true, face: true }))}</div>
      <div class="actions">${nextBtn("Climb aboard", ICON.rocket, "big")}</div>
    </div>`;
    bindPrimary(next);
  }));
  focusSoon(panel.querySelector(".opt"));
}
/* ==== games/starward/screens.js ==== */
/**
 * @file games/starward/screens.js
 * @about Starward's screens: title (high scores and jukebox), story lines, new songs, flights, the brave words, puzzles, and the ending with the score and name entry. Puzzle and flight results feed the adaptive levels here.
 * @requires kit/puzzle-ui.js, kit/flight.js, kit/typing-challenges.js, kit/jukebox.js, kit/scoreboard.js, games/starward/lumina.js
 */
const board = Kit.scoreboard.create({ storeKey: KEYS.scores });

function renderJukebox() {
  Kit.jukebox.render($("#jukeList"), {
    order: JUKEBOX, songs: Kit.songs, owned: songsOwned, where: id => SONG_WHERE[id] || "", music,
    icons: { note: ICON.note, play: ICON.play, stop: ICON.stop },
    onTurnOn: () => { musicOn = true; store.set(KEYS.music, "on"); paintToggles(); }
  });
}

/* Title */
function renderTitle() {
  active = false; flow.bump();
  mapStop(); scene.classList.add("attract"); music.set("theme");
  const saved = loadSave();
  const ideas = ["Sol", "Orion", "Lumen", "Sprocket"];
  panel.innerHTML = `<div class="card title">
    <div class="titlehead"><svg class="starmark" viewBox="-12 -12 24 24" aria-hidden="true"><use href="#spark4" class="star" transform="scale(2.2)"/></svg><div><h2 class="big">Starward</h2><p class="byline">An original space adventure</p></div></div>
    <form class="answer" id="startForm" autocomplete="off">
      <label class="sr" for="robotName">Robot name</label>
      <input id="robotName" class="field" maxlength="14" placeholder="Robot name" value="${saved ? esc(saved.robot) : ""}">
      <button class="btn big" type="submit">Play ${ICON.go}</button>
    </form>
    <div class="chips">${ideas.map(n => `<button type="button" class="chip" data-name="${n}">${n}</button>`).join("")}</div>
    ${saved ? `<div class="actions start"><button type="button" class="btn ghost" id="resumeBtn">${ICON.go} ${esc(WORLDS[saved.world] || "Keep going")}</button></div>` : ""}
    <div class="board panel-board" data-scoreboard></div>
    <section class="jukebox" aria-label="Jukebox"><p class="eyebrow">${ICON.note.replace('class="note-ic" ', "")} Jukebox</p><div class="jlist" id="jukeList"></div></section>
  </div>`;
  board.render(); renderJukebox();
  const input = $("#robotName");
  panel.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { input.value = c.dataset.name; input.focus(); }));
  $("#startForm").addEventListener("submit", e => {
    e.preventDefault(); Kit.audio.ctx(); music.unlock();
    S = fresh(); S.robot = cleanName(input.value) || "Sol"; S.plan = makePlan(); newPicker();
    active = true; store.del(KEYS.save); scene.classList.remove("attract");
    resetScene(); paintCourage(); paintCrew(); go(0);
  });
  const rb = $("#resumeBtn");
  if (rb) rb.addEventListener("click", () => { Kit.audio.ctx(); music.unlock(); S = Object.assign(fresh(), saved); newPicker(); active = true; scene.classList.remove("attract"); restore(); go(S.step); });
  focusSoon(input);
}

/* Story */
function renderSay(st) {
  const c = CAST[st.who];
  panel.innerHTML = `<div class="card say" data-who="${st.who}" style="--who:${c.color}">
    <p class="who">${esc(c.label())}</p>
    <p class="line">${T(st.x)}</p>
    <div class="actions">${nextBtn("Next", '<span class="kbd">Enter</span>')}</div>
  </div>`;
  if (st.face) express(st.face, 2200);
  if (st.who !== "narrator" && st.who !== "flame") hop(st.who);
  if (st.who === "dog") sfx.woof();
  bindPrimary(next);
}
function renderSong(st) {
  collectSong(st.id);
  const title = (Kit.songs[st.id] || {}).title || st.id;
  panel.innerHTML = `<div class="card say">
    <p class="eyebrow">New song!</p>
    <p class="songtitle">${ICON.note.replace('class="note-ic" ', "")}${esc(title)}</p>
    <div class="actions">${nextBtn("Next", '<span class="kbd">Enter</span>')}</div>
  </div>`;
  if (music.want !== WORLD_SONG[S.world]) music.set(st.id);
  sfx.song(); toast(`New song: ${title}`); express("happy");
  bindPrimary(next);
}

/* Puzzles */
function planetHead(st) { return `<div class="headrow"><p class="eyebrow">${esc(st.set === "corona" ? "Tower" : WORLDS[S.world])}</p>${pips(st.n)}</div>`; }
function helpersFor() {
  const P = Kit.art.portraits, list = [{ key: "scan", type: "scan", label: "Scan", iconHtml: P.robot, color: "var(--c-robot)" }];
  if (S.crew.includes("dog")) list.push({ key: "sniff", type: "clue", label: "Sniff", iconHtml: P.dog, color: "var(--c-dog)", who: "Sunny", onUse: () => { hop("dog"); sfx.woof(); } });
  if (S.crew.includes("peng")) list.push({ key: "peek", type: "peek", label: "Peek", iconHtml: P.peng, color: "var(--c-peng)", onUse: () => hop("peng") });
  if (S.crew.includes("rock")) list.push({ key: "ponder", type: "clue2", label: "Ponder", iconHtml: P.rock, color: "var(--c-rock)", who: "Professor Kepler", onUse: () => hop("rock") });
  return list;
}
function runPuzzle(p, opts, onDone) {
  Kit.puzzleUI.render(panel, p, {
    head: opts.head, leave: opts.leave, helpers: helpersFor(),
    icons: { check: ICON.check, eye: ICON.eye, back: ICON.back },
    nextHtml: nextBtn("Next", '<span class="kbd">Enter</span>'),
    onHint() { S.stats.hints++; express("think", 1400); save(); },
    onWrong() { hop("robot", "jolt"); express("think", 1500); },
    onWin(r) {
      hop("robot"); express("happy", 2200);
      ["dog", "peng", "rock"].forEach((w, i) => { if (S.crew.includes(w)) setTimeout(() => hop(w), 120 + i * 120); });
      if (r.shown) { S.stats.shown++; S.stats.pts += 25; addCourage(1); }
      else { S.stats.solved++; S.stats.pts += 60 + 40 * (p.d || 2); addCourage(3); }
      const outcome = r.shown ? "gaveup" : (r.tries === 0 && r.hints === 0) ? "clean" : r.tries >= 2 ? "struggle" : "ok";
      skills.record(p.skill || "words", outcome);
      if (opts.set === "corona") { S.floors = opts.n + 1; scene.dataset.floors = String(S.floors); }
      if (opts.site) map.burst(opts.site.x, opts.site.y - opts.site.beacon, TOK.gold, 12);
      save();
    },
    onDone
  });
}

/* Flights */
function renderFly(st) {
  if (st.vow) return renderVow();
  mapStop();
  if (S.world === "lumina") walkTo("pad", true);
  const leg = LEGS[st.leg], dest = st.to.replace(/^home to /, ""), head = `<p class="eyebrow">${ICON.go} ${esc(dest)}</p>`;
  let attempt = 0, lastPct = 0;
  setShip(true); music.set("theme");
  ready();
  function ready() {
    panel.innerHTML = `<div class="card">
      ${head}
      ${attempt ? `<p class="bigpct low">${lastPct}%</p>` : ""}
      ${Kit.flight.goalBar(attempt ? lastPct : 0, "", PASS * 100)}
      <div class="actions start">${attempt ? nextBtn("Fly again", ICON.retry, "big") : nextBtn("Liftoff!", ICON.rocket, "big")}</div>
    </div>`;
    bindPrimary(async () => {
      panel.innerHTML = `<div class="card">${head}${Kit.flight.goalBar(0, "", PASS * 100)}</div>`;
      const tok = flow.token(), rk = $("#flyRocket");
      const ok = await Kit.flight.countdown({
        el: $("#countdown"), alive: () => flow.alive(tok),
        onStart: () => rk.classList.add("rumble"), onStop: () => rk.classList.remove("rumble"),
        onGo: () => { setFlying(true); stars.boost(); }
      });
      if (!ok) return;
      blurActive();
      flow.setCleanup(Kit.flight.run({
        arena, panel, head,
        words: sample(leg.words, leg.n),
        timing: { base: leg.base, per: leg.per, slow: typingSlow() * (1 + .12 * Math.min(attempt, 3)) },
        maxFalling: skills.level("typing") >= 8 ? 3 : 2,
        alive: () => flow.alive(tok), onCatch: () => stars.boost(), onEnd: result
      }));
    });
  }
  function result(r) {
    const pct = Math.round(r.acc * 100), caught = r.n ? r.caught / r.n : 1;
    if (r.acc >= .95 && caught >= .9) skills.adjust("typing", 1);
    else if (r.acc < PASS || caught < .6) skills.adjust("typing", -1);
    if (r.acc >= PASS) {
      S.stats.legs[st.leg] = { hits: r.hits, misses: r.misses, typeMs: r.typeMs, typeChars: r.typeChars, caught: r.caught, n: r.n, tries: attempt + 1 };
      addCourage(1); save(); sfx.found(); express("happy");
      panel.innerHTML = `<div class="card">
        <h2 class="big">Safe <span class="hot">landing!</span></h2>
        ${Kit.flight.starRow(r.n, r.res)}
        <p class="bigpct">${pct}%</p>
        <div class="actions">${nextBtn(dest, ICON.go, "big")}</div>
      </div>`;
      bindPrimary(next);
    } else { attempt++; lastPct = pct; ready(); }
  }
}
function renderVow() {
  mapStop(); setShip(false);
  flow.setCleanup(Kit.typing.line(panel, {
    text: VOW,
    onDone: (st, doneEl) => {
      flow.setCleanup(null);
      S.stats.legs.vow = { hits: st.hits, misses: st.misses, typeMs: st.ms, typeChars: st.chars, caught: 0, n: 0 };
      addCourage(2); express("happy"); save();
      doneEl.innerHTML = nextBtn("Take the Everlight", ICON.go, "big");
      bindPrimary(next);
    }
  }));
}

/* Ending */
// Score = puzzle points (100 easy, 140 medium, 180 hard; 25 if the answer was shown) + 20 x words per minute + 5 x accuracy percent.
function computeScore() {
  const L = Object.values(S.stats.legs || {});
  const sum = k => L.reduce((t, l) => t + (Number(l[k]) || 0), 0);
  const hits = sum("hits"), misses = sum("misses"), ms = sum("typeMs"), chars = sum("typeChars");
  const acc = hits + misses ? Math.round(hits / (hits + misses) * 100) : 0;
  const wpm = ms > 0 ? Math.round((chars / 5) / (ms / 60000)) : 0;
  const puzzlePts = S.stats.pts || 0, speedPts = wpm * 20, accPts = acc * 5;
  return { acc, wpm, puzzlePts, speedPts, accPts, total: puzzlePts + speedPts + accPts };
}
function renderEnd() {
  store.del(KEYS.save); active = false;
  music.set("reborn"); express("happy", 3000);
  const sc = computeScore();
  panel.innerHTML = `<div class="card end">
    <h2 class="big">You brought back the <span class="hot">Everlight!</span></h2>
    <div class="scorecard" aria-label="Your score">
      <p class="sc-row"><span>Puzzles: ${S.stats.solved} of ${TOTAL_PUZZLES}</span><span>${sc.puzzlePts}</span></p>
      <p class="sc-row"><span>Speed: ${sc.wpm} words per minute</span><span>${sc.speedPts}</span></p>
      <p class="sc-row"><span>Accuracy: ${sc.acc}%</span><span>${sc.accPts}</span></p>
      <p class="sc-row sc-total"><span>Score</span><span>${sc.total}</span></p>
    </div>
    <div class="levels">${Object.keys(SKILLS).map(k => `<span class="lvl"><b>${SKILL_NAME[k]}</b> level ${skills.level(k)} of ${SKILLS[k].max}</span>`).join("")}</div>
    <form class="answer" id="hsForm" autocomplete="off">
      <label class="sr" for="hsName">Your name for the high score board</label>
      <input id="hsName" class="field arcade-field" maxlength="10" placeholder="YOUR NAME">
      <button class="btn check" type="submit">${ICON.check}<span class="sr">Save score</span></button>
    </form>
    <p class="rankmsg" id="rankMsg"></p>
    <div class="board end-board" data-scoreboard></div>
    <div class="actions start"><button class="btn ghost" type="button" id="againBtn">${ICON.retry} Play again</button></div>
  </div>`;
  board.render();
  $("#againBtn").addEventListener("click", () => { const name = S.robot; S = fresh(); resetScene(); paintCourage(); paintCrew(); renderTitle(); const i = $("#robotName"); if (i) i.value = name; });
  $("#hsForm").addEventListener("submit", async e => {
    e.preventDefault();
    const nm = $("#hsName").value.replace(/[^A-Za-z0-9 ]/g, "").trim().slice(0, 10);
    if (!nm) { $("#hsName").focus(); return; }
    $("#hsForm").querySelectorAll("input,button").forEach(x => { x.disabled = true; });
    const rank = await board.save({ name: nm, score: sc.total, puzzles: S.stats.solved, wpm: sc.wpm, acc: sc.acc, levels: skills.snapshot(), robot: S.robot.slice(0, 14), at: new Date().toISOString() });
    $("#rankMsg").textContent = rank && rank <= 10 ? `#${rank}!` : "Saved!";
    sfx.join(); express("happy", 2500);
    const ab = $("#againBtn"); ab.className = "btn"; focusSoon(ab);
  });
  focusSoon($("#hsName"));
}
/* ==== games/starward/boot.js ==== */
/**
 * @file games/starward/boot.js
 * @about Starts Starward: connects each story step type to its screen, resumes saved games, turns on Enter-to-continue, and keeps the game going through live page updates.
 * @requires kit/flow.js, games/starward/story.js, games/starward/screens.js
 */
const flow = Kit.flow.create({
  steps: STEPS,
  beforeStep(i) { $("#countdown").innerHTML = ""; map.busy = true; S.step = i; save(); },
  handlers: {
    world: st => { setWorld(st.w); return true; },
    appear: st => { appear(st.who); return true; },
    join: st => { join(st.who); return true; },
    flame: () => { lightFlame(false); return true; },
    say: renderSay,
    explore: renderExplore,
    build: renderBuild,
    song: renderSong,
    fly: renderFly,
    puzzle: st => runPuzzle(ask(`${st.set}-${st.n}`, S.plan[st.set][st.n], st.n), { head: planetHead(st), set: st.set, n: st.n }, next),
    end: renderEnd
  }
});
const go = flow.go, next = flow.next;

// Rebuilds the scene for a saved game: worlds visited, friends met, the Everlight if it was taken.
function restore() {
  resetScene();
  flow.replay(S.step, {
    world: st => setWorld(st.w, true),
    appear: st => appear(st.who),
    join: st => join(st.who, true),
    flame: () => lightFlame(true)
  });
  scene.dataset.floors = String(S.floors || 0);
  paintCourage(); paintCrew(); paintRockets();
}

Kit.ui.enterAdvances(panel);

try { window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)), active })); } catch (e) { /* not in a viewer */ }
function boot(data) {
  paintCourage(); paintCrew(); resetScene(); board.init();
  if (data && data.S && data.active && data.S.v === 4) { S = Object.assign(fresh(), data.S); newPicker(); active = true; scene.classList.remove("attract"); restore(); go(S.step); }
  else renderTitle();
}
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
} catch (e) { boot({}); }
})();
</script>
